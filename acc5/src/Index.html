<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fffaf1;--paper:#fffefd;--mint:#75bfa5;--mint-dark:#397a67;--peach:#ff9f8c;--yellow:#ffd982;--ink:#34423e;--soft:#71807b;--line:#e8eee8;--shadow:0 12px 30px rgba(70,102,88,.11)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#fffaf1 0%,#eff9f4 100%);color:var(--ink);font-family:'Noto Sans Thai',sans-serif;min-height:100vh}
    button,input,select{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 122px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:600 25px 'Mali';color:var(--mint-dark)}.brand small{display:block;font:400 11px 'Noto Sans Thai';color:var(--soft)}.avatar{width:40px;height:40px;border-radius:15px;background:#dff2e9;display:grid;place-items:center}
    .hero{margin:18px 0;background:linear-gradient(135deg,#72bda3,#4f9d84);color:white;border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'🏡';position:absolute;right:15px;bottom:-18px;font-size:82px;opacity:.15}.eyebrow{font-size:13px;opacity:.85}.balance{font-size:33px;font-weight:700;margin:4px 0 12px}.money-row{display:flex;gap:10px}.money-pill{background:#ffffff24;border:1px solid #ffffff30;border-radius:15px;padding:8px 11px;flex:1;font-size:12px}.money-pill strong{display:block;font-size:15px;margin-top:2px}
    .period{display:flex;background:#eaf2ed;border-radius:16px;padding:4px;margin:16px 0}.period button{flex:1;border:0;background:transparent;color:var(--soft);padding:9px;border-radius:13px;cursor:pointer}.period button.active{background:white;color:var(--mint-dark);font-weight:600;box-shadow:0 3px 9px #78948620}
    .card{background:var(--paper);border:1px solid #ffffff;border-radius:24px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.card-head h2{font-size:16px;margin:0}.muted{font-size:12px;color:var(--soft)}
    .chart{height:128px;display:flex;align-items:end;gap:9px;padding-top:10px}.bar-wrap{flex:1;text-align:center;font-size:10px;color:var(--soft)}.bar{border-radius:8px 8px 3px 3px;background:var(--peach);min-height:5px;margin-bottom:5px;transition:.4s}.bar.income{background:var(--mint)}
    .mascot-card{display:flex;gap:15px;align-items:center;background:#fff6db}.house-scene{width:105px;height:100px;position:relative;flex:none}.house{position:absolute;left:15px;bottom:4px;width:76px;height:62px;background:#fffdf7;border:3px solid #486e61;border-radius:13px 13px 17px 17px;animation:breathe 3s ease-in-out infinite}.roof{position:absolute;width:67px;height:67px;background:#86cbb4;border:3px solid #486e61;transform:rotate(45deg);left:19px;top:5px;border-radius:15px 8px;z-index:-1}.eye{position:absolute;top:20px;width:6px;height:9px;background:#34423e;border-radius:50%}.eye.l{left:20px}.eye.r{right:20px}.cheek{position:absolute;top:31px;width:11px;height:6px;background:#ffb3ad;border-radius:50%}.cheek.l{left:8px}.cheek.r{right:8px}.mouth{position:absolute;left:33px;top:34px;width:9px;height:5px;border-bottom:2px solid #34423e;border-radius:50%}.door{position:absolute;bottom:0;left:29px;width:18px;height:23px;background:#f7cb7d;border-radius:8px 8px 0 0}.prop{position:absolute;right:0;bottom:7px;font-size:25px;animation:float 2s ease-in-out infinite}.bubble{font:500 14px 'Mali';line-height:1.55}.bubble small{display:block;color:var(--soft);font:400 11px 'Noto Sans Thai';margin-top:5px}
    .record{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.ico{width:39px;height:39px;border-radius:14px;background:#fff0ec;display:grid;place-items:center}.record.income .ico{background:#e5f5ed}.details{min-width:0;flex:1}.details strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details span{font-size:11px;color:var(--soft)}.amount{font-weight:700;color:#dc7562}.income .amount{color:var(--mint-dark)}
    .composer{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fffaf1 25%)}.input-shell{width:max-content;max-width:100%;margin:auto;background:white;border:1px solid #dfe9e3;border-radius:27px;padding:7px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px #58746525;transition:.3s}.input-shell.typing{width:100%}.input-shell input{border:0;outline:0;width:0;min-width:0;opacity:0;color:var(--ink);background:transparent;transition:.3s;padding:0}.input-shell.typing input{width:100%;opacity:1;padding-left:8px}.round{border:0;width:45px;height:45px;border-radius:17px;cursor:pointer;display:grid;place-items:center;font-size:20px;flex:none;transition:.2s}.type-btn{background:#fff3d6;color:#7b673c}.mic{width:58px;height:58px;border-radius:21px;background:var(--mint);color:white;font-size:25px;box-shadow:0 6px 14px #5aa58b45}.input-shell.typing .mic{width:45px;height:45px;border-radius:17px;background:#e5f4ed;color:var(--mint-dark);box-shadow:none;font-size:20px}.send{display:none;background:var(--mint);color:white}.input-shell.has-text .send{display:grid}.input-shell.has-text .mic{display:none}.mic.listening{background:#ff9f8c!important;animation:pulse 1s infinite}
    .toast{position:fixed;z-index:30;left:50%;top:20px;transform:translate(-50%,-120px);background:#34423e;color:white;border-radius:16px;padding:12px 17px;box-shadow:var(--shadow);transition:.35s;width:max-content;max-width:90%;font-size:13px}.toast.show{transform:translate(-50%,0)}
    .modal{position:fixed;z-index:20;inset:0;background:#2d403a55;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--cream);width:min(520px,100%);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.sheet h3{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--soft)}.field.full{grid-column:1/-1}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:white;color:var(--ink);outline:none}.actions{display:flex;gap:9px;margin-top:16px}.btn{border:0;border-radius:15px;padding:11px 15px;cursor:pointer;flex:1}.btn.primary{background:var(--mint);color:white}.btn.danger{background:var(--peach);color:white}.btn.ghost{background:#e9efeb;color:var(--ink)}.empty{text-align:center;padding:18px;color:var(--soft);font-size:13px}.fab-add{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:92px;border:0;border-radius:17px;width:48px;height:48px;background:#ffd982;color:#70582e;font-size:24px;box-shadow:var(--shadow);cursor:pointer}
    @keyframes breathe{50%{transform:translateY(-3px)}}@keyframes float{50%{transform:translateY(-5px) rotate(5deg)}}@keyframes pulse{50%{transform:scale(1.08)}}
    @media(min-width:800px){.app{max-width:940px;padding-bottom:110px}.desktop-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.composer{width:min(700px,80%)}.fab-add{right:calc((100vw - 940px)/2 + 18px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">AiHouse<small>บัญชีเล็ก ๆ ของบ้านเรา</small></div><div class="avatar">👨‍👩‍👧‍👦</div></header>
    <section class="hero"><div class="eyebrow">ยอดคงเหลือในบ้าน</div><div class="balance" id="balance">฿0</div><div class="money-row"><div class="money-pill">รายรับ<strong id="income">+฿0</strong></div><div class="money-pill">รายจ่าย<strong id="expense">−฿0</strong></div></div></section>
    <nav class="period"><button data-period="day">วันนี้</button><button data-period="month" class="active">เดือนนี้</button><button data-period="year">ปีนี้</button></nav>
    <div class="desktop-grid"><div>
      <section class="card"><div class="card-head"><h2>ภาพรวมของบ้าน</h2><span class="muted" id="periodLabel">เดือนนี้</span></div><div class="chart" id="chart"></div></section>
      <section class="card"><div class="card-head"><h2>รายการล่าสุด</h2><span class="muted" id="count"></span></div><div id="records"></div></section>
    </div><div>
      <section class="card mascot-card"><div class="house-scene"><div class="roof"></div><div class="house"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i><i class="door"></i></div><div class="prop" id="prop">🎮</div></div><div class="bubble" id="mascotText">น้องเฮาส์กำลังเล่นเกมอยู่<small>มีอะไรเรียกได้เสมอนะ</small></div></section>
      <section class="card"><div class="card-head"><h2>ใช้เงินกับอะไรบ้าง</h2></div><div id="categories"></div></section>
    </div></div>
  </main>
  <button class="fab-add" onclick="openForm()" aria-label="เพิ่มรายการ">＋</button>
  <div class="composer"><div class="input-shell" id="inputShell"><button id="typeBtn" class="round type-btn" aria-label="พิมพ์คำสั่ง" title="พิมพ์คำสั่ง">⌨️</button><input id="command" aria-label="ข้อความถึงน้องเฮาส์" placeholder="บอกน้องเฮาส์ได้เลย…" autocomplete="off"><button id="mic" class="round mic" aria-label="พูดกับน้องเฮาส์" title="พูดกับน้องเฮาส์">🎤</button><button id="send" class="round send" aria-label="ส่งข้อความ" title="ส่งข้อความ">➤</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <script>
    const state={records:[],period:'month',user:'ครอบครัวเรา'};
    const byId=id=>document.getElementById(id);
    const balance=byId('balance'),income=byId('income'),expense=byId('expense'),periodLabel=byId('periodLabel'),chart=byId('chart'),records=byId('records'),count=byId('count'),categories=byId('categories');
    const inputShell=byId('inputShell'),typeBtn=byId('typeBtn'),command=byId('command'),mic=byId('mic'),send=byId('send'),mascotText=byId('mascotText'),prop=byId('prop'),modal=byId('modal'),sheet=byId('sheet');
    const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icons={'อาหาร':'🍜','เดินทาง':'🚙','บ้าน':'🏡','สาธารณูปโภค':'💡','สุขภาพ':'💊','การศึกษา':'📚','ช้อปปิ้ง':'🛍️','เงินเดือน':'💰','รายได้เสริม':'✨'};
    function load(){google.script.run.withSuccessHandler(d=>{state.records=d.records;state.user=d.user;render()}).withFailureHandler(fail).getInitialData()}
    function filtered(){const now=new Date();return state.records.filter(r=>{const d=new Date(r.date+'T12:00:00');if(state.period==='day')return d.toDateString()===now.toDateString();if(state.period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return d.getFullYear()===now.getFullYear()})}
    function render(){const list=filtered(),inc=sum(list,'รายรับ'),exp=sum(list,'รายจ่าย');balance.textContent=money(inc-exp);income.textContent='+'+money(inc);expense.textContent='−'+money(exp);periodLabel.textContent={day:'วันนี้',month:'เดือนนี้',year:'ปีนี้'}[state.period];count.textContent=list.length+' รายการ';renderChart(list);renderRecords(list);renderCats(list)}
    function sum(a,t){return a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0)}
    function renderChart(list){const groups={};list.forEach(r=>{const d=new Date(r.date+'T12:00:00'),key=state.period==='day'?d.getHours()+' น.':state.period==='month'?d.getDate()+'':(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(-2);groups[key]??={i:0,e:0};groups[key][r.type==='รายรับ'?'i':'e']+=r.amount});let entries=Object.entries(groups).slice(-7),max=Math.max(1,...entries.flatMap(x=>[x[1].i,x[1].e]));chart.innerHTML=entries.length?entries.map(([k,v])=>`<div class="bar-wrap"><div style="display:flex;align-items:end;gap:3px;height:100px"><div class="bar income" style="height:${v.i/max*100}%;flex:1"></div><div class="bar" style="height:${v.e/max*100}%;flex:1"></div></div>${k}</div>`).join(''):'<div class="empty" style="width:100%">เริ่มบันทึกรายการแรกกันเถอะ 🌱</div>'}
    function renderRecords(list){records.innerHTML=list.slice(0,8).map(r=>`<div class="record ${r.type==='รายรับ'?'income':''}" onclick="openEdit('${r.id}')"><div class="ico">${icons[r.category]||'🧾'}</div><div class="details"><strong>${esc(r.note||r.category)}</strong><span>${esc(r.category)} · ${new Date(r.date+'T12:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</span></div><div class="amount">${r.type==='รายรับ'?'+':'−'}${money(r.amount)}</div></div>`).join('')||'<div class="empty">ยังไม่มีรายการในช่วงนี้นะ</div>'}
    function renderCats(list){const map={};list.filter(r=>r.type==='รายจ่าย').forEach(r=>map[r.category]=(map[r.category]||0)+r.amount);const vals=Object.entries(map).sort((a,b)=>b[1]-a[1]),max=vals[0]?.[1]||1;categories.innerHTML=vals.slice(0,5).map(([k,v])=>`<div style="margin:11px 0;font-size:12px"><div style="display:flex;justify-content:space-between"><span>${icons[k]||'🧾'} ${esc(k)}</span><b>${money(v)}</b></div><div style="height:7px;background:#edf1ee;border-radius:9px;margin-top:5px"><i style="display:block;width:${v/max*100}%;height:100%;background:#ffad9c;border-radius:9px"></i></div></div>`).join('')||'<div class="empty">ยังไม่มีรายจ่ายนะ</div>'}
    document.querySelectorAll('.period button').forEach(b=>b.onclick=()=>{document.querySelector('.period .active').classList.remove('active');b.classList.add('active');state.period=b.dataset.period;render()});
    typeBtn.onclick=()=>{inputShell.classList.add('typing');command.focus()};
    command.oninput=()=>inputShell.classList.toggle('has-text',!!command.value.trim());
    command.onblur=()=>{if(!command.value.trim())setTimeout(()=>inputShell.classList.remove('typing'),180)};
    send.onclick=submitCommand;command.onkeydown=e=>{if(e.key==='Enter')submitCommand()};
    function submitCommand(){const text=command.value.trim();if(!text)return;setBusy(true,'น้องเฮาส์กำลังจดให้อยู่นะ…','✏️');google.script.run.withSuccessHandler(handleResult).withFailureHandler(fail).processCommand(text)}
    function clearComposer(){command.value='';inputShell.classList.remove('has-text','typing')}
    function handleResult(r){setBusy(false);if(r.needsChoice){openChoices(r);return}if(r.needsConfirm){openConfirm(r);return}clearComposer();toast(r.message);mascot(r.message,'✅');refresh()}
    function refresh(){google.script.run.withSuccessHandler(d=>{state.records=d.records;render()}).withFailureHandler(fail).getInitialData()}
    function setBusy(on,text,emoji){send.disabled=on;mic.disabled=on;if(on)mascot(text,emoji)}
    function fail(e){setBusy(false);toast(e.message||String(e));mascot('อุ๊ย มีบางอย่างขัดข้อง ลองอีกครั้งนะ','🩹')}
    function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
    function mascot(t,p){mascotText.innerHTML=esc(t)+'<small>น้องเฮาส์อยู่ตรงนี้เสมอ</small>';prop.textContent=p||'🏡'}
    function openForm(r={}){sheet.innerHTML=`<h3>${r.id?'แก้ไขรายการ':'เพิ่มรายการใหม่'}</h3><div class="form-grid"><label class="field">ประเภท<select id="fType"><option ${r.type==='รายรับ'?'selected':''}>รายรับ</option><option ${r.type!=='รายรับ'?'selected':''}>รายจ่าย</option></select></label><label class="field">จำนวนเงิน<input id="fAmount" inputmode="decimal" type="number" value="${r.amount||''}" placeholder="0"></label><label class="field">วันที่<input id="fDate" type="date" value="${r.date||new Date().toISOString().slice(0,10)}"></label><label class="field">หมวดหมู่<input id="fCat" value="${esc(r.category||'')}" placeholder="เช่น อาหาร"></label><label class="field full">รายละเอียด<input id="fNote" value="${esc(r.note||'')}" placeholder="เช่น ข้าวกลางวัน"></label></div><div class="actions">${r.id?'<button class="btn danger" onclick="askDelete(\''+r.id+'\')">ลบ</button>':''}<button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveForm('${r.id||''}')">บันทึก</button></div>`;modal.classList.add('show')}
    function openEdit(id){openForm(state.records.find(r=>r.id===id)||{})}
    function saveForm(id){const data={type:fType.value,amount:Number(fAmount.value),date:fDate.value,category:fCat.value,note:fNote.value,user:state.user};if(!data.amount){toast('ใส่จำนวนเงินก่อนนะ');return}const runner=google.script.run.withSuccessHandler(r=>{closeModal();toast(r.message);refresh()}).withFailureHandler(fail);id?runner.updateRecord(id,data):runner.addRecord(data)}
    function askDelete(id){const r=state.records.find(x=>x.id===id);sheet.innerHTML=`<h3>ลบรายการนี้ใช่ไหม?</h3><div class="record"><div class="ico">${icons[r.category]||'🧾'}</div><div class="details"><strong>${esc(r.note)}</strong><span>${esc(r.category)}</span></div><div class="amount">−${money(r.amount)}</div></div><p class="muted">รายการจะถูกย้ายไปถังขยะและยังอยู่ใน Sheet</p><div class="actions"><button class="btn ghost" onclick="closeModal()">เก็บไว้</button><button class="btn danger" onclick="confirmAction('delete','${id}',{})">ลบรายการ</button></div>`}
    function openConfirm(r){const x=r.record;sheet.innerHTML=`<h3>${r.message}</h3><div class="record ${x.type==='รายรับ'?'income':''}"><div class="ico">${icons[x.category]||'🧾'}</div><div class="details"><strong>${esc(x.note)}</strong><span>${esc(x.category)} · ${x.date}</span></div><div class="amount">${money(x.amount)}</div></div><div class="actions"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn ${r.action==='delete'?'danger':'primary'}" onclick='confirmAction(${JSON.stringify(r.action)},${JSON.stringify(x.id)},${JSON.stringify(r.changes)})'>ยืนยัน</button></div>`;modal.classList.add('show')}
    function openChoices(r){sheet.innerHTML=`<h3>${r.message}</h3>${r.records.map(x=>`<div class="record" onclick='chooseAction(${JSON.stringify(r.action)},${JSON.stringify(x.id)},${JSON.stringify(r.changes)})'><div class="ico">${icons[x.category]||'🧾'}</div><div class="details"><strong>${esc(x.note)}</strong><span>${x.date}</span></div><div class="amount">${money(x.amount)}</div></div>`).join('')}<div class="actions"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button></div>`;modal.classList.add('show')}
    function chooseAction(action,id,changes){closeModal();openConfirm({action,changes,record:state.records.find(x=>x.id===id),message:action==='delete'?'ต้องการลบรายการนี้ใช่ไหม?':'แก้รายการนี้ใช่ไหม?'})}
    function confirmAction(action,id,changes){const runner=google.script.run.withSuccessHandler(r=>{closeModal();clearComposer();toast(r.message);refresh()}).withFailureHandler(fail);action==='delete'?runner.deleteRecord(id):runner.updateRecord(id,changes)}
    function closeModal(){modal.classList.remove('show')};modal.onclick=e=>{if(e.target===modal)closeModal()}
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SpeechRecognition){
      const rec=new SpeechRecognition();rec.lang='th-TH';rec.interimResults=false;rec.maxAlternatives=1;
      mic.onclick=()=>{
        try{
          rec.start();mic.classList.add('listening');mascot('น้องเฮาส์กำลังฟังอยู่นะ…','🎧');toast('พูดได้เลยนะ');
        }catch(e){mic.classList.remove('listening');const denied=e.name==='NotAllowedError'||e.name==='SecurityError';toast(denied?'กรุณาอนุญาตไมโครโฟน แล้วลองใหม่อีกครั้ง':'เปิดไมโครโฟนไม่ได้: '+(e.message||e.name));mascot('น้องเฮาส์ยังไม่ได้รับอนุญาตใช้ไมค์','🎤')}
      };
      rec.onresult=e=>{command.value=e.results[0][0].transcript;command.dispatchEvent(new Event('input'));mic.classList.remove('listening');submitCommand()};
      rec.onerror=e=>{mic.classList.remove('listening');const messages={'not-allowed':'ยังไม่ได้รับอนุญาตใช้ไมโครโฟน','audio-capture':'ไม่พบไมโครโฟนในเครื่อง','no-speech':'ยังไม่ได้ยินเสียง ลองพูดอีกครั้งนะ','network':'บริการแปลงเสียงเชื่อมต่อไม่ได้'};toast(messages[e.error]||'ฟังไม่สำเร็จ: '+e.error)};
      rec.onend=()=>mic.classList.remove('listening');
    }else{mic.onclick=()=>{toast('เบราว์เซอร์นี้ยังไม่รองรับปุ่มพูด ลองเปิดด้วย Chrome หรือใช้ปุ่มไมค์บนคีย์บอร์ด');inputShell.classList.add('typing');command.focus()}}
    const activities=[['กำลังเล่นเกมอยู่','🎮'],['กำลังฟังเพลงโปรด','🎧'],['กำลังดูหนังเพลิน ๆ','🍿'],['กำลังกินขนมอยู่','🍪'],['กำลังทานข้าว','🍚'],['กำลังอ่านหนังสือ','📖']];function idle(){const h=new Date().getHours(),a=h<7||h>=22?['น้องเฮาส์หลับปุ๋ยอยู่','💤']:activities[Math.floor(Math.random()*activities.length)];mascot(a[0],a[1])}setInterval(idle,45000);idle();load();
  </script>
</body>
</html>
