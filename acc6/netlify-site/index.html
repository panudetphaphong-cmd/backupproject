<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f6c90e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WD cafe">
  <title>WD cafe</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="manifest" href="/manifest.webmanifest?v=8">
  <link rel="icon" type="image/jpeg" href="/assets/wonder-duck-logo-app.jpg?v=7">
  <link rel="apple-touch-icon" href="/assets/wonder-duck-logo-app.jpg?v=7">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe
    id="wdApp"
    credentialless
    referrerpolicy="no-referrer"
    allow="geolocation; camera; microphone; payment; autoplay; fullscreen"
    loading="eager">
  </iframe>
  <script>
    const wdFrame = document.getElementById('wdApp');
    const wdExec = 'https://script.google.com/macros/s/AKfycbwTqNnkY1KsL1uGJFBkTLV8ONZQkEI5z3_d2n5gj--cvNIVxpOpt7KIpI9KS40ZYq38/exec?host=netlify-v8';
    const readCookie = name => decodeURIComponent((document.cookie.split('; ').find(x=>x.startsWith(name+'='))||'=').split('=').slice(1).join('='));
    const writeLoginCookie = token => { document.cookie = 'wd_device_token=' + encodeURIComponent(token||'') + '; Path=/; Max-Age=' + (token ? 31536000 : 0) + '; SameSite=Lax; Secure'; };
    const wdToken = localStorage.getItem('wd_persistent_token') || readCookie('wd_device_token') || sessionStorage.getItem('wd_session_token') || '';
    const wdRemember = !!localStorage.getItem('wd_persistent_token');
    wdFrame.src = wdExec + (wdToken ? '#wd_token=' + encodeURIComponent(wdToken) : '');
    window.addEventListener('message', event => {
      if (!event.data || !['WD_TOKEN','WD_TOKEN_REQUEST'].includes(event.data.type)) return;
      const trustedGoogle = event.origin === 'null' || /^https:\/\/([a-z0-9-]+\.)?(googleusercontent\.com|google\.com)$/.test(event.origin);
      if (event.source !== wdFrame.contentWindow && !trustedGoogle) return;
      if (event.data.type === 'WD_TOKEN_REQUEST') {
        event.source.postMessage({type:'WD_RESTORE_TOKEN',token:wdToken,remember:wdRemember},'*');
        return;
      }
      if (event.data.token) {
        localStorage.removeItem('wd_persistent_token');
        sessionStorage.removeItem('wd_session_token');
        (event.data.remember === false ? sessionStorage : localStorage).setItem(event.data.remember === false ? 'wd_session_token' : 'wd_persistent_token', event.data.token);
        writeLoginCookie(event.data.remember === false ? '' : event.data.token);
      } else {
        localStorage.removeItem('wd_persistent_token');
        sessionStorage.removeItem('wd_session_token');
        writeLoginCookie('');
      }
    });
    wdFrame.addEventListener('load',()=>{
      if(wdToken) wdFrame.contentWindow.postMessage({type:'WD_RESTORE_TOKEN',token:wdToken,remember:wdRemember},'*');
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
    }
    if ('caches' in window) caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
  </script>
</body>
</html>
