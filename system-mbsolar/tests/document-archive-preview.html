function documentRecordCard(record){const x=record.row,receipt=(S.data.receipts||[]).find(r=>r.invoiceId===x.id),invoices=(S.data.invoices||[]).filter(r=>r.quotationId===x.id),labels={QT:'ใบเสนอราคา',IV:'ใบแจ้งหนี้ / ใบกำกับภาษี',RC:'ใบเสร็จรับเงิน'},status=record.kind==='QT'?quotationStatus(x.status):record.kind==='IV'?(receipt?'มีใบเสร็จแล้ว':'รอออกใบเสร็จ'):'ออกใบเสร็จแล้ว';let next='';if(record.kind==='QT'&&record.workType==='Solar Cell')next=documentButton('openInvoice',x.id,invoices.length?'ดูงวดชำระ':'ออกใบแจ้งหนี้');if(record.kind==='IV')next=receipt?documentButton('printReceipt',receipt.id,'เปิดใบเสร็จ'):documentButton('openReceipt',x.id,'ออกใบเสร็จ');const reference=record.kind==='RC'?[x.invoiceNo,x.quoteNo].filter(Boolean).join(' · '):record.kind==='IV'?x.quoteNo:'';return `<article class="archive-record" data-record-id="${esc(record.id)}"><div class="archive-file-icon ${record.kind}" aria-hidden="true">${record.kind}</div><div class="archive-record-main"><div class="archive-record-title"><b>${esc(record.no||'ไม่ระบุเลขเอกสาร')}</b><span class="archive-status">${esc(status)}</span></div><p>${labels[record.kind]}${record.kind!=='QT'?' · งวดที่ '+Number(x.installment):''} · ${esc(record.workType)}</p>${reference?`<small>อ้างอิง ${esc(reference)}</small>`:''}<small>${esc(record.kind==='RC'?'รับชำระ':'วันที่ออก')} ${esc(thaiDocumentDate(record.date))}</small></div><div class="archive-record-amount"><b>${money(record.amount)}</b><small>รวม VAT</small></div><div class="archive-record-actions">${documentButton(record.kind==='QT'?'printQuotation':record.kind==='IV'?'printInvoice':'printReceipt',x.id,'เปิด PDF','primary')}${next}${record.quoteId?documentButton('documentShowChain',record.quoteId,'ดูเอกสารชุดนี้','subtle'):''}${record.kind==='QT'?`<details class="archive-more"><summary>เพิ่มเติม</summary><div>${documentButton('openQuotation',x.id,'แก้ไขใบเสนอราคา')}${documentButton('removeQuotation',x.id,'ลบใบเสนอราคา','danger')}</div></details>`:''}</div></article>`}
function documentArchiveContent(archive){const customer=archive.customers.find(x=>x.key===S.documentCustomer),query=S.documentQuery||'';if(!customer){const visible=archive.customers.map(x=>({...x,shown:x.records.filter(r=>(!S.documentWorkType||r.workType===S.documentWorkType)&&documentMatches(r,query))})).filter(x=>x.shown.length);return `<div class="archive-result-heading"><b>แฟ้มลูกค้า ${visible.length} ราย</b><span>เรียงตามเอกสารล่าสุด</span></div><div class="archive-customer-grid">${visible.map(x=>`<button type="button" class="archive-customer" data-customer-key="${esc(x.key)}" onclick="openDocumentCustomer(this.dataset.customerKey)"><span class="archive-folder-icon" aria-hidden="true">▰</span><span class="archive-customer-name">${esc(x.name)}</span><span class="archive-customer-contact">${esc(x.phone||x.taxId||'ยังไม่มีข้อมูลติดต่อ')}</span><span class="archive-type-tags">${[...new Set(x.records.map(r=>r.workType))].map(t=>`<span>${esc(t)}</span>`).join('')}</span><span class="archive-counts">${['QT','IV','RC'].map(t=>`<span><b>${x.records.filter(r=>r.kind===t).length}</b> ${t}</span>`).join('')}</span><span class="archive-customer-latest">ล่าสุด ${esc(thaiDocumentDate(x.shown[0].date))}<b>เปิดแฟ้ม →</b></span></button>`).join('')||`<div class="archive-empty"><b>${archive.customers.length?'ไม่พบลูกค้าที่ค้นหา':'เริ่มจัดเก็บเอกสารลูกค้า'}</b><p>${archive.customers.length?'ลองค้นด้วยชื่อ เบอร์โทร หรือเลขเอกสารอื่น':'สร้างใบเสนอราคาใบแรก ระบบจะจัดเข้าแฟ้มลูกค้าให้อัตโนมัติ'}</p>${archive.customers.length?'<button class="archive-action" onclick="documentFilter(\'documentQuery\',\'\')">ล้างคำค้น</button>':'<button class="archive-action primary" onclick="chooseQuotationForm()">สร้างใบเสนอราคา</button>'}</div>`}</div>`}const kind={quotations:'QT',invoices:'IV',receipts:'RC'}[S.documentTab],records=customer.records.filter(r=>(!kind||r.kind===kind)&&(!S.documentYear||r.date.startsWith(S.documentYear))&&(!S.documentChain||r.quoteId===S.documentChain)&&documentMatches(r,query));return `<div class="archive-result-heading"><b>${records.length} เอกสาร</b><span>ล่าสุดอยู่ด้านบน</span></div><div class="archive-record-list">${records.map(documentRecordCard).join('')||'<div class="archive-empty"><b>ยังไม่มีเอกสารในรายการนี้</b><p>เลือกประเภทอื่น หรือล้างตัวกรองเพื่อดูประวัติทั้งหมด</p><button class="archive-action" data-customer-key="'+esc(customer.key)+'" onclick="openDocumentCustomer(this.dataset.customerKey)">ดูเอกสารทั้งหมด</button></div>'}</div>`}
function documentArchivePage(){const archive=documentArchive(),customer=archive.customers.find(x=>x.key===S.documentCustomer);if(S.documentCustomer&&!customer)S.documentCustomer='';const years=customer?[...new Set(customer.records.map(r=>r.date.slice(0,4)).filter(Boolean))].sort().reverse():[];return `<section class="document-archive"><div class="archive-breadcrumb"><button type="button" onclick="documentCustomersHome()">แฟ้มลูกค้าทั้งหมด</button>${customer?`<span aria-hidden="true">/</span><b>${esc(customer.name)}</b>`:''}</div><header class="archive-heading"><div><span class="archive-eyebrow">${customer?'ประวัติเอกสารลูกค้า':'ศูนย์เอกสาร'}</span><h3>${customer?esc(customer.name):'แฟ้มเอกสารลูกค้า'}</h3><p>${customer?esc([customer.phone,customer.taxId?'เลขผู้เสียภาษี '+customer.taxId:'',customer.address].filter(Boolean).join(' · ')):'ใบเสนอราคา ใบแจ้งหนี้ และใบเสร็จ รวมไว้ในแฟ้มของลูกค้าแต่ละราย'}</p></div>${customer?'<button type="button" class="archive-action" onclick="documentCustomersHome()">← กลับแฟ้มลูกค้า</button>':''}</header>${customer?`<div class="archive-tabs" role="group" aria-label="ประเภทเอกสาร">${[['all','ทั้งหมด',''],['quotations','ใบเสนอราคา','QT'],['invoices','ใบแจ้งหนี้','IV'],['receipts','ใบเสร็จ','RC']].map(([tab,label,kind])=>`<button type="button" class="${(S.documentTab||'all')===tab?'active':''}" aria-pressed="${(S.documentTab||'all')===tab}" onclick="showDocumentTab('${tab}')">${label}<span>${customer.records.filter(r=>!kind||r.kind===kind).length}</span></button>`).join('')}</div>`:`<div class="archive-overview"><span><b>${archive.customers.length}</b> ลูกค้า</span><span><b>${archive.records.length}</b> เอกสารทั้งหมด</span><span>QT → IV → RC</span></div>`}<div class="archive-controls"><label class="archive-search"><span>ค้นหา${customer?'ในแฟ้มนี้':'ลูกค้าหรือเอกสาร'}</span><input type="search" value="${esc(S.documentQuery||'')}" placeholder="ชื่อ / เบอร์โทร / เลข QT, IV, RC" oninput="documentSearch(this.value)"></label>${customer?`<label><span>ปีของเอกสาร</span><select onchange="documentFilter('documentYear',this.value)"><option value="">ทุกปี</option>${years.map(year=>`<option value="${esc(year)}" ${S.documentYear===year?'selected':''}>${Number(year)+543}</option>`).join('')}</select></label>`:`<label><span>ประเภทงาน</span><select onchange="documentFilter('documentWorkType',this.value)"><option value="">ทุกประเภทงาน</option>${['Solar Cell','EV Charger'].map(t=>`<option value="${t}" ${S.documentWorkType===t?'selected':''}>${t}</option>`).join('')}</select></label>`}</div>${customer&&S.documentChain?`<div class="archive-chain-filter"><span>ชุดเอกสาร ${esc(customer.records.find(r=>r.quoteId===S.documentChain)?.row.quoteNo||'')}</span><button type="button" onclick="documentFilter('documentChain','')">แสดงทุกชุด ×</button></div>`:''}<div id="documentArchiveResults">${documentArchiveContent(archive)}</div>${!customer?`<details class="archive-library"><summary>ตั้งค่าฟอร์มและชุดราคา <span>Solar Cell / EV Charger</span></summary>${quotationLibraryTools()}</details>`:''}</section>`}
function renderDocuments(){$('page-documents').innerHTML=documentArchivePage()};renderDocuments();</script></body></html>
