function quotationDocumentRows(items){return items.map((x,i)=>{const lines=String(x.description||'').split('\n'),nested=(lines[0].startsWith('งานติดตั้งสถานี')||lines[0].startsWith('งานติดตั้งระบบ Solar Roof'))&&lines.includes('รายการย่อยที่ลูกค้าจะได้รับ'),details=nested?lines.slice(2):[],cellStyle=nested?'border-bottom:0;':'',main=`<tr><td class="center" style="${cellStyle}">${i+1}</td><td style="text-align:left;overflow-wrap:anywhere;${cellStyle}">${nested?'<b>'+esc(lines[0])+'</b><div style="margin-top:3px">รายการย่อยที่ลูกค้าจะได้รับ</div>':nl2br(x.description)}</td><td class="center" style="${cellStyle}">${Number(x.quantity).toLocaleString('th-TH')}</td><td class="center" style="${cellStyle}">${esc(x.unit)}</td><td class="num" style="${cellStyle}">${money(x.unitPrice)}</td><td class="num" style="${cellStyle}">${money(quotationLineAmount(x))}</td></tr>`;return main+details.map((line,j)=>{const match=line.match(/^(.*?)\s+—\s+([\d.,]+)\s+(.+)$/),text=match?match[1]:line,style='border-top:0;'+(j<details.length-1?'border-bottom:0;':'');return `<tr class="quotation-subitem"><td style="${style}"></td><td style="text-align:left;overflow-wrap:anywhere;${style}">${esc(text)}</td><td class="center" style="${style}">${match?esc(match[2]):''}</td><td class="center" style="${style}">${match?esc(match[3]):''}</td><td style="${style}"></td><td style="${style}"></td></tr>`}).join('')}).join('')}

function quotationSignatures(preview=false,q={}){const solar=q.workType==='Solar Cell'||q.company?.taxId==='0403566004363',height=preview?'15px':'30px',line=`width:75%;max-width:${preview?'90px':'180px'};margin:0 auto;border-top:1px solid #888;padding-top:3px`;return `<section style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:${preview?'14px':'28px'};margin-top:${preview?'20px':'38px'};text-align:center;font-size:${preview?'6.5px':'9px'};line-height:1.5;break-inside:avoid;page-break-inside:avoid;color:#171717"><div><b>${q.documentKind==='RECEIPT'?'ลูกค้า / ผู้ชำระเงิน':q.documentKind==='INVOICE'?'ลูกค้า / ผู้รับเอกสาร':'ลูกค้า / ผู้อนุมัติใบเสนอราคา'}</b><div style="height:${height}"></div><div class="customer-signature-name" style="${line};min-height:1.5em;overflow-wrap:anywhere">${esc(q.customerName||'')}</div><div style="margin-top:5px;white-space:nowrap">วันที่ ${q.issueDate?esc(thaiDocumentDate(q.issueDate)):'—'}</div></div><div><b>${solar?'ห้างหุ้นส่วนจำกัด เอ็มบี โซล่า':'บริษัท / ผู้มีอำนาจลงนาม'}</b><div style="height:${height};display:flex;align-items:center;justify-content:center">${q.company?.signatureData?`<img alt="ลายเซ็นบริษัท" src="${esc(q.company.signatureData)}" style="display:block;max-width:75%;width:${preview?'85px':'170px'};height:100%;object-fit:contain">`:''}</div><div style="${line};overflow-wrap:anywhere">${esc(quotationCompany(q.company).signerName)}</div><div style="margin-top:5px;white-space:nowrap">วันที่ ${q.issueDate?esc(thaiDocumentDate(q.issueDate)):'—'}</div>${solar?`<div style="height:${preview?'30px':'60px'};display:flex;align-items:center;justify-content:center"><img alt="ตราประทับ ห้างหุ้นส่วนจำกัด เอ็มบี โซล่า" src="${quotationSolarStamp()}" style="max-width:80%;width:${preview?'80px':'160px'};max-height:100%;object-fit:contain"></div>`:''}</div></section>`}
function quotationHeader(logo,preview=false,q={}){const company=quotationCompany(q.company),solar=q.workType==='Solar Cell'||company.taxId==='0403566004363',detailStyle=`min-width:0;line-height:1.4;font-size:${preview?'6.5px':'9px'};overflow-wrap:anywhere`,field=(label,value)=>`<div><span>${label}: </span>${value}</div>`;return `<header class="quotation-parties" style="display:grid;grid-template-columns:minmax(0,35fr) minmax(0,30fr) minmax(0,35fr);align-items:start;gap:${preview?'4px':'8px'};border-bottom:3px solid #f4c400;padding-bottom:${preview?'5px':'8px'};margin-bottom:5px;color:#171717"><div class="quotation-company-block" style="${detailStyle};text-align:left"><b class="quotation-company-name" data-print-font-size="${solar?11:10}" style="display:block;max-width:100%;white-space:${solar&&!preview?'nowrap':'normal'};overflow-wrap:anywhere;font-size:${solar?(preview?'7px':'11px'):(preview?'7px':'10px')}">${esc(company.name)}</b>${field('เบอร์โทร',esc(company.phone))}${field('อีเมล',esc(company.email))}${field('เลขผู้เสียภาษี',esc(company.taxId))}${field('ที่อยู่',quotationCompanyAddress(company.address))}</div><div class="quotation-brand-heading" style="min-width:0;min-height:0;align-self:stretch;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px"><strong style="display:block;font-size:${q.documentKind==='RECEIPT'?'16px':q.documentKind==='INVOICE'?'12px':preview?'11px':'20px'};line-height:1.2;white-space:nowrap">${q.documentKind==='RECEIPT'?'ใบเสร็จรับเงิน':q.documentKind==='INVOICE'?'ใบแจ้งหนี้/ใบกำกับภาษี':'ใบเสนอราคา'}</strong><span style="display:block;font-size:${preview?'6px':'9px'};letter-spacing:${q.documentKind==='INVOICE'?0:1}px">${q.documentKind==='RECEIPT'?'RECEIPT':q.documentKind==='INVOICE'?'Invoice / Tax Invoice':'QUOTATION'}</span>${logo?`<div class="quotation-logo-fit" style="position:relative;flex:1;align-self:stretch;min-height:0"><img src="${esc(logo)}" alt="โลโก้บริษัท" style="position:absolute;inset:0;display:block;width:100%;height:100%;max-width:100%;object-fit:contain;object-position:center top"></div>`:preview?'<span style="font-size:8px;color:#777">LOGO</span>':''}</div><div class="quotation-customer-block" style="${detailStyle};text-align:right">${field('เลขที่','<b>'+esc(q.quoteNo||'ระบบสร้างอัตโนมัติ')+'</b>')}${q.documentKind==='RECEIPT'?field('เลขที่อ้างอิง IV',esc(q.referenceInvoiceNo))+field('เลขที่อ้างอิง QT',esc(q.referenceQuoteNo)):q.documentKind==='INVOICE'?field('เลขที่อ้างอิง',esc(q.referenceQuoteNo)):''}${field(q.documentKind==='RECEIPT'?'วันที่รับชำระ':'วันที่',thaiDocumentDate(q.issueDate))}${field('ชื่อลูกค้า','<b>'+esc(q.customerName||'ชื่อลูกค้า')+'</b>')}${field('เบอร์โทร',esc(q.customerPhone||'-'))}${field('เลขผู้เสียภาษี',esc(q.customerTaxId||'-'))}${field('ที่อยู่',nl2br(q.customerAddress)||'-')}</div></header>`}
const INITIAL_DATA=<?!= initialData ?>;const now=new Date(),S={token:'',data:INITIAL_DATA,page:'dashboard',wageYear:String(now.getFullYear()),wageMonth:String(now.getMonth()+1).padStart(2,'0')}; const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date(Date.now()+7*60*60*1000).toISOString().slice(0,10);
function displayDate(value){const s=String(value||'').trim(),ymd=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(ymd)return ymd[3].padStart(2,'0')+'/'+ymd[2].padStart(2,'0')+'/'+ymd[1];const dmy=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);if(dmy)return dmy[1].padStart(2,'0')+'/'+dmy[2].padStart(2,'0')+'/'+dmy[3];return s||'-'}
function setStatus(text,type='') {const el=$('syncStatus');if(!el)return;el.textContent=text;el.className='sync-status '+type} function call(action,data={}){loading(true);return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(done)return;done=true;loading(false);setStatus('เชื่อมต่อล้มเหลว','error');reject(new Error('เซิร์ฟเวอร์ใช้เวลานานเกิน 45 วินาที กรุณาลองใหม่'))},45000),finish=(fn,value,failed=false)=>{if(done)return;done=true;clearTimeout(timer);loading(false);setStatus(failed?'เกิดข้อผิดพลาด':'บันทึกสำเร็จ',failed?'error':'');fn(value)};google.script.run.withSuccessHandler(x=>finish(resolve,x)).withFailureHandler(e=>finish(reject,new Error(e.message||e),true)).api(action,{token:S.token,...data})})} function loading(v){setStatus(v?'กำลังบันทึก...':'พร้อมใช้งาน',v?'busy':'');if(v)Swal.fire({title:'กำลังบันทึกข้อมูล...',allowOutsideClick:false,allowEscapeKey:false,showConfirmButton:false,customClass:{popup:'mb-loading',title:'mb-loading-title'},didOpen:()=>Swal.showLoading()});else if(Swal.isLoading())Swal.close()} function toast(t){setStatus('พร้อมใช้งาน');Swal.fire({toast:true,position:'top-end',icon:'success',title:t,showConfirmButton:false,timer:1800,timerProgressBar:true,background:'#fff',color:'#13231d',customClass:{popup:'mb-toast',title:'mb-toast-title',timerProgressBar:'mb-toast-progress'}})} function fireError(t){setStatus('เกิดข้อผิดพลาด','error');return Swal.fire({icon:'error',title:'ไม่สามารถทำรายการได้',text:t,confirmButtonText:'ตกลง',confirmButtonColor:'#087a55',customClass:{popup:'mb-popup',title:'mb-title',confirmButton:'mb-confirm'}})} function can(p){return(S.data.permissions||[]).includes(p)}
async function login(e){e.preventDefault();enter()} async function init(){localStorage.removeItem('mb_token');if(S.data)enter();else fireError('ไม่พบข้อมูลเริ่มต้นจากเซิร์ฟเวอร์')} function enter(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=S.data.user.name;$('userRole').textContent='OWNER · โหมดทดสอบ';$('versionBadge').textContent='v'+(S.data.appVersion||'2.5.1');setStatus('พร้อมใช้งาน');render();showPage(S.page)} function logout(){location.reload()}

function realBalanceSummary(){const accounts=(S.data.balanceAccounts||[]).map(x=>({...x,balance:Number(x.openingBalance)||0}));const find=name=>accounts.find(x=>x.name===String(name||'').trim());(S.data.income||[]).forEach(x=>{const a=find(x.account);if(a)a.balance+=Number(x.total!=null?x.total:x.amountExVat)||0});(S.data.expenses||[]).forEach(x=>{const a=find(x.paidBy);if(a)a.balance-=Number(x.total!=null?x.total:x.amountExVat)||0});(S.data.dividends||[]).forEach(x=>{const a=find(x.paidFrom);if(a)a.balance-=Number(x.amount)||0});const cash=accounts.filter(x=>x.type==='CASH').reduce((s,x)=>s+x.balance,0),company=accounts.filter(x=>x.type==='COMPANY').reduce((s,x)=>s+x.balance,0);return{accounts,CASH:cash,COMPANY:company,total:cash+company}}

ue="รายจ่าย">รายจ่าย</option></select><select id="financeHistoryMonth" aria-label="เดือน" onchange="filterFinanceHistory()"><option value="">ทั้งปี / ทุกเดือน</option>${thaiMonths.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('')}</select><select id="financeHistoryYear" aria-label="ปี" onchange="filterFinanceHistory()"><option value="">ทุกปี</option>${years.map(y=>`<option value="${y}">${Number(y)+543}</option>`).join('')}</select></div><div class="metrics finance-history-summary"><div class="card metric"><small>รายรับรวม</small><b id="financeHistoryIncome" class="positive">${money(incomeTotal)}</b></div><div class="card metric"><small>รายจ่ายรวม</small><b id="financeHistoryExpense" class="negative">${money(expenseTotal)}</b></div><div class="card metric"><small>คงเหลือสุทธิ</small><b id="financeHistoryNet" class="${incomeTotal-expenseTotal<0?'negative':'positive'}">${money(incomeTotal-expenseTotal)}</b></div></div><div class="card finance-ledger"><div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>ประเภท</th><th>หน้างาน</th><th>รายละเอียด</th><th>ช่องทาง</th><th>ยอดเงิน</th><th>จัดการ</th></tr></thead><tbody>${rows.map(x=>`<tr class="finance-history-row ${x.type==='รายรับ'?'finance-row-income':'finance-row-expense'}" data-project="${x.projectId}" data-date="${esc(String(x.date||'').slice(0,10))}" data-type="${x.type}" data-amount="${Number(x.total||0)}"><td class="history-date">${esc(displayDate(x.date))}</td><td><span class="finance-type-badge">${x.type}</span></td><td>${esc(pname(x.projectId))}</td><td>${esc(x.desc)}</td><td>${esc(x.account||x.paidBy||'-')}</td><td><b>${x.type==='รายรับ'?'+':'−'}${money(x.total)}</b></td><td><div class="history-row-actions"><button type="button" class="history-edit-btn" onclick="loadTransactionIntoEntry('${x.type==='รายรับ'?'INCOME':'EXPENSE'}','${x.id}')">แก้ไข</button><button type="button" class="history-delete-btn" onclick="removeTransaction('${x.type==='รายรับ'?'INCOME' function quotationSetPicker(type){const sets=(S.data.quotePresets||[]).filter(x=>x.kind==='SET'&&x.workType===type),option=x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${money((x.data.items||[]).reduce((s,i)=>s+quotationLineAmount(i),0))}</option>`;return `<div class="field quotation-set-picker"><label>เพิ่มจากชุดรายการ ${esc(type)} (ราคาก่อน VAT)</label><div class="quotation-set-controls quotation-set-controls-simple"><select aria-label="เลือกชุดรายการ" id="quotationSetSelect"><option value="">เลือกชุดรายการ</option>${(type==='Solar Cell'?['On-grid','Hybrid On/Off-grid','อื่น ๆ'].map(group=>{const groupSets=sets.filter(x=>(x.name.startsWith('On-grid')?'On-grid':x.name.startsWith('Hybrid')?'Hybrid On/Off-grid':'อื่น ๆ')===group);return groupSets.length?'<optgroup label="'+esc(group)+'">'+groupSets.map(option).join('')+'</optgroup>':''}).join(''):sets.map(option).join(''))}</select><button type="button" class="btn secondary" onclick="insertQuotationSet()">+ เพิ่มชุด</button><button type="button" class="btn secondary" onclick="clearQuotationItems()">ล้างรายการทั้งหมด</button></div><small>${sets.length?'เพิ่มต่อท้ายรายการเดิม และแก้ไขราคาเฉพาะใบนี้ได้':'ยังไม่มีชุด — สร้างได้จากหน้ารวมใบเสนอราคา > จัดการชุดรายการ'}</small></div>`}

function insertQuotationSet(){const id=$('quotationSetSelect').value,form=document.querySelector('.quotation-editor'),set=(S.data.quotePresets||[]).find(x=>x.id===id&&x.kind==='SET'&&x.workType===form.elements.workType.value);if(!set)return;const selectedItems=quotationPackageRows(set.data.items,form.elements.workType.value),body=$('quotationItems'),blank=[...body.rows].filter(row=>!row.querySelector('[data-q="description"]').value.trim()&&!Number(row.querySelector('[data-q="unitPrice"]').value));if(body.rows.length-blank.length+selectedItems.length>100)return fireError('เพิ่มได้สูงสุด 100 รายการ');blank.forEach(row=>row.remove());body.insertAdjacentHTML('beforeend',selectedItems.map(quotationItemRow).join(''));$('quotationSetSelect').value='';updateQuotationTotal();renderQuotationPreview()}
function quotationCompany(company={}){const value=Object.assign({signerName:'สุภาวดี ผาผง (กรรมการ)',name:'บริษัท โกเนกซ์ เอ็นจิเนียริ่ง กรุ๊ป จำกัด',phone:'096-1239119',email:'co.gonext@gmail.com',taxId:'0445569001456',address:'เลขที่ 80 ม.10 ต.หัวขวาง อ.โกสุมพิสัย จ.มหาสารคาม 44140',bankName:'ธนาคารกสิกรไทย',bankAccount:'236-2-83891-9',accountName:'บริษัท โกเนกซ์ เอ็นจิเนียริ่ง กรุ๊ป จำกัด'},company||{});if(String(value.address).trim()==='เลขที่ 80 ม.10 ต.หัวขวาง อ.โกสุมพิสัย จ.มหาสารคาม')value.address+=' 44140';return value}
function quotationCompanyForm(q,mode){const c=quotationCompany(q.company);return `<details class="quotation-editor-section" style="${mode==='SET'?'display:none':''}" ${mode==='TEMPLATE'?'open':''}><summary><b>ข้อมูลบริษัท / ผู้ออกเอกสาร</b> <small>กดเพื่อแก้ไข</small></summary><div class="form-grid">${[['name','ชื่อบริษัท'],['phone','เบอร์โทร'],['email','อีเมล'],['taxId','เลขผู้เสียภาษี'],['address','ที่อยู่'],['accountName','ชื่อบัญชี'],['bankName','ธนาคาร'],['bankAccount','เลขบัญชี'],['signerName','ชื่อผู้ลงนามบริษัท']].map(([k,label])=>`<div class="field ${['name','address'].includes(k)?'quotation-address':''}"><label>${label}</label><input name="company_${k}" value="${esc(c[k])}" maxlength="${k==='address'?1000:200}"></div>`).join('')}</div>${quotationSignatureUpload(c)}<small>แก้ไขเฉพาะใบนี้ได้ หากต้องการใช้กับใบใหม่ ให้บันทึกในเมนูตั้งค่าฟอร์ม</small></details>`}

function quotationCompanyAddress(address){return nl2br(String(address||'').replace(/\s*\r?\n\s*((?:จ\.|จังหวัด))/g,' $1'))}
function quotationSignatureUpload(c){return `<div class="field" style="margin-top:14px"><label>ภาพลายเซ็นบริษัท</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="loadQuotationSignature(this)"><input type="hidden" name="company_signatureData" value="${esc(c.signatureData||'')}"><div style="display:flex;gap:12px;align-items:center"><img id="quotationSignatureThumb" class="${c.signatureData?'':'hidden'}" src="${esc(c.signatureData||'')}" alt="ตัวอย่างลายเซ็น" style="max-width:180px;height:55px;object-fit:contain"><button type="button" class="btn secondary" onclick="clearQuotationSignature(this.form)">เอาลายเซ็นออก</button></div><small>ใช้ภาพลายเซ็นบริษัทที่คุณมีสิทธิ์ใช้ แนะนำ PNG พื้นหลังโปร่งใส · บันทึกในตั้งค่าฟอร์มเพื่อใช้กับใบใหม่</small></div>`}
function clearQuotationSignature(form){form.elements.company_signatureData.value='';const thumb=$('quotationSignatureThumb');thumb.removeAttribute('src');thumb.classList.add('hidden');renderQuotationPreview()}
function loadQuotationSignature(input){const file=input.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024){input.value='';return fireError('ใช้ไฟล์ PNG, JPG หรือ WebP ขนาดไม่เกิน 8 MB')}const form=input.form,reader=new FileReader();reader.onerror=()=>fireError('อ่านไฟล์ลายเซ็นไม่สำเร็จ');reader.onload=()=>{const img=new Image();img.onerror=()=>fireError('เปิดภาพลายเซ็นไม่สำเร็จ');img.onload=()=>{if(!form.isConnected)return;let data='';for(const width of [420,320,240,180]){const scale=Math.min(1,width/img.width,160/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL('image/webp',.85);if(data.length<=20000)break}if(data.length>20000)return fireError('ภาพมีรายละเอียดมากเกินไป กรุณาครอปให้เหลือเฉพาะลายเซ็น');form.elements.company_signatureData.value=data;const thumb=$('quotationSignatureThumb');thumb.src=data;thumb.classList.remove('hidden');renderQuotationPreview()};img.src=reader.result};reader.readAsDataURL(file)}
function fitQuotationPrint(w){const doc=w.document,content=doc.querySelector('.paper-content');if(!content)return;content.style.zoom='1';doc.querySelectorAll('.quotation-company-name').forEach(el=>{let size=Number(el.getAttribute('data-print-font-size'))||10;el.style.fontSize=size+'px';while(el.scrollWidth>el.clientWidth+1&&size>5){size-=.25;el.style.fontSize=size+'px'}});doc.querySelectorAll('.invoice-terms-line').forEach(el=>{let size=9;el.style.fontSize=size+'px';while(el.scrollWidth>el.clientWidth&&size>5){size-=.25;el.style.fontSize=size+'px'}});const footer=doc.querySelector('.paper-footer'),maxHeight=272.5*96/25.4-(footer?footer.getBoundingClientRect().height:0),height=content.getBoundingClientRect().height;content.style.zoom=String(Math.min(1,maxHeight/Math.max(height,1)));}
function quotationProjectTitle(q){if(q.workType==='Solar Cell'){const titles=(q.items||[]).map(x=>String(x.description||'').split('\n')[0]).filter(x=>x.startsWith('งานติดตั้งระบบ Solar Roof'));return titles.length?'เสนอโครงการ '+titles.join(' / '):'เสนอโครงการติดตั้งระบบ Solar Cell'}const models=new Map();(q.items||[]).forEach(item=>{const text=String(item.description||''),match=text.match(/Flexxfast[^\n]*?(\d+(?:\.\d+)?)\s*kW/i);if(!match)return;let count=0;if(text.startsWith('งานติดตั้งสถานี')){const qty=text.match(/—\s*(\d+)\s*เครื่อง/);count=qty?Number(qty[1]):0}else if(item.unit==='เครื่อง'||item.packagePrice===true)count=Number(item.quantity)||0;else if(item.unit==='ชุด'){const quantity=text.match(/จำนวน\s*(\d+)\s*เครื่อง/);if(quantity)count=Number(quantity[1])}if(count>0)models.set(match[1],(models.get(match[1])||0)+count)});return models.size?'เสนอโครงการติดตั้งเครื่องอัดประจุความเร็วสูง '+[...models].map(([kw,count])=>kw+' kW จำนวน '+count+' ตู้').join(' และ '):'รายการสินค้าและบริการที่เสนอ'}
function quotationColumns(){return '<colgroup><col style="width:5%"><col style="width:47%"><col style="width:7%"><col style="width:7%"><col style="width:16%"><col style="width:18%"></colgroup>'}
function quotationPackageRows(items,workType){if(workType==='Solar Cell')return items;const out=[];for(let i=0;i<items.length;i++){const x=items[i],match=String(x.description||'').match(/^.*Flexxfast[^\n]*?(\d+(?:\.\d+)?)\s*kW/i);if(!x.packagePrice||!match||String(x.description).startsWith('งานติดตั้งสถานี')){out.push(x);continue}const group=[x];while(items[i+1]?.packageIncluded===true)group.push(items[++i]);if(group.length===1){out.push(x);continue}out.push({description:'งานติดตั้งสถานีอัดประจุไฟฟ้าความเร็วสูง (DC Charge) ขนาด '+match[1]+' kW\nรายการย่อยที่ลูกค้าจะได้รับ\n'+group.map(item=>'• '+item.description+' — '+item.quantity+' '+item.unit).join('\n'),quantity:1,unit:'งาน',unitPrice:group.reduce((sum,item)=>sum+quotationLineAmount(item),0),packagePrice:true,packageIncluded:false})}return out.map(item=>({...item,description:String(item.description||'').replace(/IP55/g,'IP65')}))}
function quotationDescriptionHtml(x){const lines=String(x.description||'').split('\n');if(!(lines[0].startsWith('งานติดตั้งสถานี')||lines[0].startsWith('งานติดตั้งระบบ Solar Roof'))||!lines.includes('รายการย่อยที่ลูกค้าจะได้รับ'))return nl2br(x.description);return '<b>'+esc(lines[0])+'</b><div style="margin-top:4px;font-size:.95em;text-align:left">'+lines.slice(1).map(line=>'<div style="margin:0 0 2px;line-height:1.4">'+esc(line)+'</div>').join('')+'</div>'}
function quotationLineAmount(x){return Math.round(((x.packagePrice===true?Number(x.unitPrice):Number(x.quantity)*Number(x.unitPrice))+Number.EPSILON)*100)/100}
function quotationRowData(row){return {description:row.querySelector('[data-q="description"]').value,quantity:Number(row.querySelector('[data-q="quantity"]').value)||0,unit:row.querySelector('[data-q="unit"]').value,unitPrice:Number(row.querySelector('[data-q="unitPrice"]').value)||0,packagePrice:row.dataset.packagePrice==='true',packageIncluded:row.dataset.packageIncluded==='true'}}
function quotationPriceLabel(x,total=false){if(x.packagePrice&&!total)return 'เหมารวมชุด';if(x.packageIncluded&&!Number(x.unitPrice))return 'รวมในชุด';return money(total?quotationLineAmount(x):x.unitPrice)}
function quotationStatus(status){return{DRAFT:'ฉบับร่าง',SENT:'ส่งแล้ว',APPROVED:'อนุมัติแล้ว'}[status]||'ฉบับร่าง'}
function quotationTypeFolder(quotes,type){const list=quotes.filter(q=>(q.workType==='Solar Cell'?'Solar Cell':'EV Charger')===type),groups=list.reduce((o,q)=>{const key=q.customerName||'ไม่ระบุลูกค้า';(o[key]||(o[key]=[])).push(q);return o},Object.create(null)),amount=list.reduce((sum,q)=>sum+Number(q.grandTotal||0),0);return `<details class="document-folder document-worktype-folder" data-work-type="${esc(type)}"><summary><span><b>📁 ${type==='EV Charger'?'EV':'Solar Cell'}</b><small>${Object.keys(groups).length} ลูกค้า · ${list.length} ใบเสนอราคา</small></span><b>${money(amount)}</b></summary><div class="document-folder-body">${Object.entries(groups).map(([customer,list],i)=>`<details class="document-folder" ><summary><span><b>📁 ${esc(customer)}</b><small>${list.length} ใบเสนอราคา</small></span><b>${money(list.reduce((s,x)=>s+Number(x.grandTotal||0),0))}</b></summary><div class="document-folder-body">${list.map(q=>`<div class="quotation-row"><div><b>${esc(q.quoteNo)}</b><br><small>${esc(q.workType)} · ${esc(displayDate(q.issueDate))}</small></div><span class="quotation-status ${esc(q.status)}">${quotationStatus(q.status)}</span><b>${money(q.grandTotal)}</b><small>${(q.items||[]).length} รายการ</small><div class="quotation-actions">${type==='Solar Cell'?`<button onclick="openInvoice('${q.id}')">ออกใบแจ้งหนี้</button>`:''}<button onclick="printQuotation('${q.id}')">PDF / พิมพ์</button><button onclick="openQuotation('${q.id}')">แก้ไข</button><button class="delete" onclick="removeQuotation('${q.id}')">ลบ</button></div></div>`).join('')}</div></details>`).join('')||'<div class="quotation-empty">ยังไม่มีใบเสนอราคาในโฟลเดอร์นี้</div>'}</div></details>`}

function documentArchive(data=S.data){const quotes=data.quotations||[],invoices=data.invoices||[],receipts=data.receipts||[],quoteMap=new Map(quotes.map(x=>[x.id,x])),invoiceMap=new Map(invoices.map(x=>[x.id,x])),customers=new Map(),records=[],normalize=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();for(const [kind,rows] of [['QT',quotes],['IV',invoices],['RC',receipts]])for(const row of rows){const quoteId=kind==='QT'?row.id:row.quotationId||row.snapshot?.id||'',source=quoteMap.get(quoteId)||(kind==='QT'?row:invoiceMap.get(row.invoiceId)?.snapshot||row.snapshot)||{},name=String(source.customerName||'').trim()||'ไม่ระบุชื่อลูกค้า',tax=normalize(source.customerTaxId),phone=String(source.customerPhone||'').replace(/\D/g,''),key=tax?'tax:'+tax:name!=='ไม่ระบุชื่อลูกค้า'?'name:'+normalize(name)+'|'+phone:'unknown:'+quoteId,record={kind,row,id:row.id,no:String((kind==='QT'?row.quoteNo:kind==='IV'?row.invoiceNo:row.receiptNo)||''),date:String(row.issueDate||'').slice(0,10),amount:Number(row.grandTotal)||0,quoteId,customerKey:key,workType:source.workType||'Solar Cell',source};let customer=customers.get(key);if(!customer){customer={key,name,phone:source.customerPhone||'',taxId:source.customerTaxId||'',address:source.customerAddress||'',records:[]};customers.set(key,customer)}customer.records.push(record);records.push(record)}for(const customer of customers.values()){customer.records.sort((a,b)=>b.date.localeCompare(a.date)||String(b.row.createdAt||'').localeCompare(String(a.row.createdAt||''))||b.no.localeCompare(a.no));customer.latest=customer.records[0]?.date||''}return {customers:[...customers.values()].sort((a,b)=>b.latest.localeCompare(a.latest)||a.name.localeCompare(b.name,'th')),records}}
function documentMatches(record,query){return [record.no,record.row.quoteNo,record.row.invoiceNo,record.date,record.source.customerName,record.source.customerPhone,record.source.customerTaxId,record.workType,record.source.customerAddress].join(' ').toLowerCase().includes(String(query||'').trim().toLowerCase())}

function loadQuotationLogo(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>8*1024*1024)return fireError('ไฟล์โลโก้ต้องไม่เกิน 8 MB');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=360,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/webp',.82);if(data.length>44000)data=canvas.toDataURL('image/jpeg',.65);if(data.length>45000)return fireError('โลโก้มีรายละเอียดมากเกินไป กรุณาใช้รูปที่เรียบหรือขนาดเล็กลง');const form=input.form;form.logoData.value=data;const thumb=$('quotationLogoThumb');thumb.src=data;thumb.classList.remove('hidden');renderQuotationPreview()};img.src=reader.result};reader.readAsDataURL(file)}

async function removeQuotation(id){const q=(S.data.quotations||[]).find(x=>x.id===id);if(!q)return;const ask=await Swal.fire({icon:'warning',title:'ลบใบเสนอราคา?',html:`<b>${esc(q.quoteNo)}</b><div class="muted" style="margin-top:6px">${esc(q.customerName)}</div>`,showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#b8443b',customClass:{popup:'mb-popup',title:'mb-title'}});if(ask.isConfirmed)await submit('deleteQuotation',{id},'ลบใบเสนอราคาแล้ว')}
function thaiDocumentDate(value){const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${Number(m[1])+543}`:displayDate(value)}
function thaiIntegerText(n){const digit=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],unit=['','สิบ','ร้อย','พัน','หมื่น','แสน'];n=Math.floor(Math.abs(n));if(n===0)return digit[0];if(n>=1000000)return thaiIntegerText(Math.floor(n/1000000))+'ล้าน'+(n%1000000?thaiIntegerText(n%1000000):'');const s=String(n),len=s.length;let out='';for(let i=0;i<len;i++){const d=Number(s[i]),pos=len-i-1;if(!d)continue;if(pos===1&&d===1)out+='สิบ';else if(pos===1&&d===2)out+='ยี่สิบ';else if(pos===0&&d===1&&len>1)out+='เอ็ด';else out+=digit[d]+unit[pos]}return out}
function thaiBahtText(value){const amount=Math.round((Number(value)||0)*100),baht=Math.floor(amount/100),satang=amount%100;return thaiIntegerText(baht)+'บาท'+(satang?thaiIntegerText(satang)+'สตางค์':'ถ้วน')}

function balanceSettingsContent(){const summary=realBalanceSummary();return`<div class="section-head"><div><h3>ตั้งค่าเงินคงเหลือ</h3><span class="muted">จัดการเงินสดและบัญชีบริษัทหลายบัญชี</span></div><button class="btn" onclick="openBalanceAccount()">+ เพิ่มบัญชี</button></div><div class="balance-settings-grid">${summary.accounts.map(a=>`<article class="card balance-setting-card"><div><span class="tag">${a.type==='CASH'?'เงินสด':'บัญชีบริษัท'}</span><h3>${esc(a.name)}</h3><small>ยอดตั้งต้น ${money(a.openingBalance||0)}</small></div><b class="${a.balance<0?'negative':'positive'}">${money(a.balance)}</b><div class="balance-setting-actions"><button class="btn secondary" onclick="openBalanceAccount('${a.id}')">แก้ไข</button><button class="btn danger" onclick="removeBalanceAccount('${a.id}')">ลบ</button></div></article>`).join('')||'<div class="card empty">ยังไม่มีบัญชี</div>'}</div><div class="hint">ยอดปัจจุบันคำนวณจากยอดตั้งต้น รวมกับรายการรับ–จ่ายและเงินปันผลของบัญชีนั้นโดยอัตโนมัติ</div>`}
function dividendContent(){const paid=S.data.dividends.reduce((s,x)=>s+Number(x.amount||0),0),available=Math.max(0,S.data.totals.profit-paid),completed=S.data.projects.filter(x=>String(x.status).toUpperCase()==='COMPLETED');return`<div class="metrics" style="margin-bottom:16px"><div class="card metric"><small>กำไรรวมก่อนจ่ายหุ้นส่วน</small><b>${money(S.data.totals.profit)}</b></div><div class="card metric"><small>จ่ายหุ้นส่วนแล้ว</small><b class="negative">${money(paid)}</b></div><div class="card metric"><small>กำไรคงเหลือ</small><b class="positive">${money(available)}</b></div><div class="card metric"><small>โปรเจกต์ที่เสร็จแล้ว</small><b>${completed.length}</b></div></div><div class="section-head dividend-section-head"><div><h3>สรุปกำไรโปรเจกต์ที่เสร็จแล้ว</h3><span class="muted">กำไรแต่ละโปรเจกต์มีไว้ดูผลประกอบการ ไม่ผูกกับการปันผล</span></div></div><div class="completed-profit-grid">${completed.map(completedProfitCard).join('')||'<div class="card empty">ยังไม่มีโปรเจกต์สถานะเสร็จแล้ว</div>'}</div><div class="section-head dividend-section-head"><div><h3>ประวัติกำไรที่หุ้นส่วนได้รับ</h3><span class="muted">แบ่งจากกำไรรวมและหักจากแหล่งเงินจริง</span></div><button type="button" class="btn" onclick="openProjectDividend()" ${available>0?'':'disabled'}>+ ปันผลกำไร</button></div><div class="grid2">${S.data.partners.map(p=>`<div class="card partner-dividend-card"><div class="salary-head"><div><div class="muted">หุ้นส่วน</div><b style="font-size:20px">${esc(p.name)}</b></div><div class="partner-paid-total"><small>ได้รับแล้ว</small><b>${money(p.totalPaid)}</b></div></div>${p.payments.slice(0,10).map(x=>`<div class="advance-row"><span>${esc(displayDate(x.date))} · ${x.projectId?esc(pname(x.projectId)):'กำไรรวม'}<br><small class="muted">จาก ${esc(x.paidFrom||'-')}</small></span><b class="positive">+${money(x.amount)}</b></div>`).join('')||'<div class="empty">ยังไม่ได้รับกำไร</div>'}</div>`).join('')}</div>`}
function completedProfitCard(p){const income=Math.max(0,Number(p.income)||0),expense=Math.max(0,Number(p.expenses)||0),profit=Number(p.profit)||0,expensePct=income?expense/income*100:(expense?100:0),profitPct=income?profit/income*100:0,expenseWidth=Math.max(0,Math.min(100,expensePct)),profitWidth=Math.max(0,Math.min(100,profitPct));return`<article class="card completed-profit-card"><div class="completed-profit-head"><div><span class="project-status completed"><i></i>เสร็จแล้ว</span><h3>${esc(p.name)}</h3><small>${projectMeta(p)}</small></div><div class="completed-profit-main"><small>กำไรหลังหักรายจ่าย</small><b class="${profit<0?'negative':'positive'}">${money(profit)}</b><em class="${profit<0?'negative':''}">${profitPct.toFixed(1)}%</em></div></div><div class="profit-ratio-bar"><i class="expense" style="width:${expenseWidth}%"></i><i class="profit" style="width:${profitWidth}%"></i></div><div class="profit-ratio-legend"><span><i class="expense"></i>รายจ่าย ${money(expense)} · ${expensePct.toFixed(1)}%</span><span><i class="profit"></i>กำไร ${money(profit)} · ${profitPct.toFixed(1)}%</span><small>รายรับ ${money(income)}</small></div></article>`}

const BANK_PRODUCTS=[{id:'GSB',name:'ธนาคารออมสิน',mark:'GSB',color:'#e64291',available:true,maxYears:7,maxLoan:500000,minDownRate:20,rates:[{months:24,rate:3.5},{months:36,rate:5},{months:24,rate:6.045}],rateLabels:['3.50% ปี 1–2','5.00% ปี 3–5','6.045% ปี 6–7 (MRR)'],plan:'GSB Solar for Life · ลูกค้าทั่วไป · Clean Loan'},{id:'KBANK',name:'กสิกรไทย',mark:'KBank',color:'#138f55',available:true,maxYears:7,minDownRate:0,interestType:'FLAT',annualRate:5.42,rates:[{months:84,rate:5.42}],rateLabels:['5.42% Flat Rate ตลอดสัญญา'],plan:'สินเชื่อโซลาร์เซลล์ · Flat Rate 5.42% ต่อปี'},{id:'SCB',name:'ไทยพาณิชย์',mark:'SCB',color:'#4e2a84',available:true,maxYears:7,minDownRate:0,rates:[{months:84,rate:3.25}],rateLabels:['3.25% เรทตั้งต้นชั่วคราว'],plan:'สินเชื่อเพื่อความยั่งยืน · เรทตั้งต้นชั่วคราว 3.25% ต่อปี'},{id:'TISCO',name:'ทิสโก้',mark:'TISCO',color:'#1672b8',available:true,maxYears:7,minDownRate:0,interestType:'FLAT',annualRate:4,rates:[{months:84,rate:4}],rateLabels:['4.00% Flat Rate เรทเริ่มต้น'],plan:'Solar Rooftop · Flat Rate เริ่มต้น 4.00% ต่อปี'},{id:'ICBC',name:'ไอซีบีซี (ไทย)',mark:'ICBC',color:'#c51622',available:true,maxYears:7,minDownRate:0,interestType:'FLAT',annualRate:4.25,rates:[{months:84,rate:4.25}],rateLabels:['4.25% Flat Rate เรทเริ่มต้น'],plan:'Solar Rooftop Financing · Flat Rate เริ่มต้น 4.25% ต่อปี'},{id:'CUSTOM',name:'กำหนดแผนเอง',mark:'✦',color:'#475569',available:true,custom:true,maxYears:7,minDownRate:0,plan:'กำหนดชื่อแผน ประเภท และดอกเบี้ยเอง'}];
function renderLoan(){S.selectedBank=S.selectedBank||'GSB';S.loanDraft=S.loanDraft||{price:'',downPercent:0};S.customDraft=S.customDraft||{name:'แผนกำหนดเอง',type:'FLAT',rate:5};$('page-loan').innerHTML=`<div class="loan-calculator"><section class="card loan-bank-section"><div class="loan-step"><span>1</span><div><b>เลือกธนาคาร</b><small>เลือกก่อนเพื่อใช้อัตราดอกเบี้ยของธนาคารนั้น</small></div></div><div class="loan-bank-picker">${BANK_PRODUCTS.map(b=>`<button type="button" class="loan-bank-btn ${S.selectedBank===b.id?'active':''}" style="--bank-color:${b.color}" onclick="selectLoanBank('${b.id}')"><span class="bank-mark">${esc(b.mark)}</span><span><b>${esc(b.id)}</b><small>${esc(b.name)}</small></span>${b.available?'':'<i>รอเรต</i>'}</button>`).join('')}</div></section><section class="card loan-input-section"><div class="loan-step"><span>2</span><div><b>ราคาและเงินดาวน์</b><small>ราคาที่กรอกเป็นราคาขายสุดท้าย ระบบจะหักเฉพาะดาวน์ของลูกค้า</small></div></div><div class="loan-input-grid"><div class="field"><label>ราคาขายสุดท้าย (บาท)</label><input id="loanPrice" type="number" value="${S.loanDraft.price}" min="0" step="1000" oninput="calcLoan()"></div><div class="field"><label>ลูกค้าดาวน์ (%)</label><input id="loanDownPercent" type="number" value="${S.loanDraft.downPercent}" min="0" max="100" step="1" oninput="calcLoan()"></div><div class="loan-down-summary"><small>เงินดาวน์</small><b id="loanDownAmount">฿0</b></div><div class="loan-down-summary primary"><small>ยอดจัดสินเชื่อ</small><b id="loanPrincipal">฿0</b></div></div><div class="loan-quick-down"><span>เลือกเร็ว:</span>${[0,10,20,30].map(x=>`<button type="button" onclick="setDownPercent(${x})">${x}%</button>`).join('')}</div>${S.selectedBank==='CUSTOM'?`<div class="custom-loan-settings"><div class="field"><label>ชื่อแผน</label><input id="customPlanName" value="${esc(S.customDraft.name)}" oninput="calcLoan()"></div><div class="field"><label>ประเภทดอกเบี้ย</label><select id="customInterestType" onchange="calcLoan()"><option value="FLAT" ${S.customDraft.type==='FLAT'?'selected':''}>Flat Rate</option><option value="REDUCING" ${S.customDraft.type==='REDUCING'?'selected':''}>ลดต้นลดดอก</option></select></div><div class="field"><label>ดอกเบี้ยต่อปี (%)</label><input id="customAnnualRate" type="number" value="${S.customDraft.rate}" min="0" max="100" step="0.01" oninput="calcLoan()"></div></div>`:''}</section><section class="card loan-table-section"><div class="loan-step"><span>3</span><div><b>ตารางระยะผ่อน 3–7 ปี</b><small id="loanPlanName">ค่างวดโดยประมาณของธนาคารที่เลือก</small></div></div><div id="bankResults"></div></section></div>`;calcLoan()}
function selectLoanBank(id){S.loanDraft={price:$('loanPrice')?.value||'',downPercent:Math.min(100,Math.max(0,Number($('loanDownPercent')?.value)||0))};if($('customPlanName'))S.customDraft={name:$('customPlanName').value||'แผนกำหนดเอง',type:$('customInterestType').value,rate:Math.max(0,Number($('customAnnualRate').value)||0)};S.selectedBank=id;renderLoan()}
function setDownPercent(percent){if($('loanDownPercent'))$('loanDownPercent').value=percent;calcLoan()}
function amortizeSteps(principal,years,steps){let balance=principal,totalPaid=0,firstPayment=0,used=0;const totalMonths=years*12;for(const step of steps){const count=Math.min(step.months,totalMonths-used);if(count<=0)break;const remaining=totalMonths-used,r=step.rate/1200,payment=r?balance*r*Math.pow(1+r,remaining)/(Math.pow(1+r,remaining)-1):balance/remaining;if(!firstPayment)firstPayment=payment;for(let i=0;i<count;i++){const interest=balance*r;balance=Math.max(0,balance-(payment-interest));totalPaid+=payment}used+=count}return{monthly:firstPayment,total:totalPaid,balance}}
function calcLoan(){
  if(!$('loanPrice')||!$('bankResults'))return;
  const price=Math.max(0,Number($('loanPrice').value)||0),downPercent=Math.min(100,Math.max(0,Number($('loanDownPercent').value)||0)),customerDown=price*downPercent/100,principal=Math.max(0,price-customerDown),base=BANK_PRODUCTS.find(x=>x.id===S.selectedBank)||BANK_PRODUCTS[0];
  if(base.custom)S.customDraft={name:$('customPlanName')?.value||'แผนกำหนดเอง',type:$('customInterestType')?.value||'FLAT',rate:Math.max(0,Number($('customAnnualRate')?.value)||0)};
  const b=base.custom?Object.assign({},base,{name:S.customDraft.name,plan:(S.customDraft.type==='FLAT'?'Flat Rate ':'ลดต้นลดดอก ')+S.customDraft.rate.toFixed(2)+'% ต่อปี',interestType:S.customDraft.type==='FLAT'?'FLAT':'REDUCING',annualRate:S.customDraft.rate,rates:[{months:84,rate:S.customDraft.rate}],rateLabels:[S.customDraft.rate.toFixed(2)+'% '+(S.customDraft.type==='FLAT'?'Flat Rate':'ลดต้นลดดอก')]}):base;
  $('loanDownAmount').textContent=money(customerDown);$('loanPrincipal').textContent=money(principal);$('loanPlanName').textContent=b.name+' · '+b.plan;
  if(!b.available){$('bankResults').innerHTML=`<div class="loan-rate-empty"><div class="bank-mark" style="background:${b.color}">${esc(b.mark)}</div><b>ยังไม่มีข้อมูลอัตราดอกเบี้ย ${esc(b.name)}</b><span>ส่งภาพหรือรายละเอียดโปรโมชั่นมาได้ ระบบจะเพิ่มตาราง 3–7 ปีในตำแหน่งนี้</span></div>`;return}
  const warnings=[];
  if(Number.isFinite(b.maxLoan)&&principal>b.maxLoan)warnings.push(`ยอดจัดเกินวงเงินสูงสุด ${money(b.maxLoan)} อยู่ ${money(principal-b.maxLoan)}`);
  if(downPercent<(b.minDownRate||0))warnings.push(`โปรโมชั่นธนาคารระบุดาวน์ขั้นต่ำ ${b.minDownRate}% โปรดตรวจเงื่อนไขก่อนยื่น`);
  const termCards=[3,4,5,6,7].map(years=>{const result=b.interestType==='FLAT'?(()=>{const total=principal*(1+(b.annualRate/100)*years);return{monthly:total/(years*12),total}})():amortizeSteps(principal,years,b.rates),interest=Math.max(0,result.total-principal);return`<article class="loan-term-card"><div class="loan-term-head"><b>${years} ปี</b><span>${years*12} งวด</span><em>${esc(b.name)}</em></div><div class="loan-term-context"><span>ยอดจัดสินเชื่อ</span><span><b>${money(principal)}</b></span></div><div class="loan-term-main"><small>ค่างวดต่อเดือน</small><strong>${money(result.monthly)}</strong></div><div class="loan-term-stat interest"><small>ดอกเบี้ยรวมประมาณการ</small><b>${money(interest)}</b></div><div class="loan-term-stat total"><small>ยอดชำระรวม</small><b>${money(result.total)}</b></div></article>`}).join('');
  const rateStrip=(b.rateLabels||[]).map(label=>{const parts=label.split(' ');return`<span><b>${esc(parts.shift())}</b> ${esc(parts.join(' '))}</span>`}).join('');
  const methodNote=b.interestType==='FLAT'?'คำนวณแบบ Flat Rate จากเงินต้นเต็มตลอดสัญญา':b.id==='GSB'?'ค่างวดเป็นการประมาณแบบลดต้นลดดอก และอาจปรับเมื่อเข้าสู่ช่วงอัตราดอกเบี้ยใหม่หรือ MRR เปลี่ยนแปลง':b.custom?'คำนวณแบบลดต้นลดดอกจากอัตราที่กำหนดเอง':'คำนวณแบบลดต้นลดดอกโดยใช้เรทชั่วคราว 3.25% ตลอดระยะสัญญา โปรดอัปเดตเมื่อได้รับเรทจริง';
  $('bankResults').innerHTML=`${warnings.length?`<div class="loan-warning">${warnings.join(' · ')}</div>`:''}<div class="loan-selection-summary"><div><small>ธนาคาร / แผนที่เลือก</small><b>${esc(b.name)}</b></div><div><small>ยอดจัดสินเชื่อ</small><b>${money(principal)}</b></div><div><small>เงินดาวน์ ${downPercent}%</small><b>${money(customerDown)}</b></div></div><div class="loan-rate-strip">${rateStrip}</div><div class="loan-term-grid">${termCards}</div><div class="bank-note">${methodNote}</div>`
}
function showLoanDetail(years,monthly,interest,total){Swal.fire({title:`ผ่อน ${years} ปี (${years*12} งวด)`,html:`<div class="loan-detail-grid"><div><small>ค่างวดเริ่มต้น/เดือน</small><b>${money(monthly)}</b></div><div><small>ดอกเบี้ยรวมประมาณการ</small><b>${money(interest)}</b></div><div><small>ยอดชำระรวม</small><b>${money(total)}</b></div></div><div class="hint">ค่างวดอาจเปลี่ยนเมื่ออัตราดอกเบี้ยเปลี่ยนช่วง</div>`,confirmButtonText:'ปิด',confirmButtonColor:'#087a55',customClass:{popup:'mb-popup',title:'mb-title',htmlContainer:'mb-html',confirmButton:'mb-confirm'}})}
function lookupList(items,type){return items.map(x=>`<div class="lookup-row"><b>${esc(x.name)}</b><span class="lookup-order">ลำดับ ${Number(x.sortOrder)||'-'}</span><button type="button" class="btn secondary" onclick="openLookup('${type}','${x.id}')">แก้ไข</button><button type="button" class="btn danger" onclick="removeLookup('${type}','${x.id}')">ลบ</button></div>`).join('')||'<div class="empty">ยังไม่มีรายการ</div>'}
function renderSettings(){const users=can('USERS_MANAGE')?`<details class="settings-group"><summary><span>👤</span><div><b>ผู้ใช้งานและสิทธิ์</b><small>เพิ่มผู้ใช้และตรวจสอบสิทธิ์การเข้าถึงระบบ</small></div></summary><div class="settings-group-body"><div class="settings-group-head"><button type="button" class="btn" onclick="openUser()">+ เพิ่มผู้ใช้</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ชื่อ</th><th>Username</th><th>Role</th><th>สิทธิ์</th></tr></thead><tbody>${S.data.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.permissions==='*'?'ทั้งหมด':esc(u.permissions||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีผู้ใช้</td></tr>'}</tbody></table></div></div></details>`:'';$('page-settings').innerHTML=`<div class="settings-stack"><details class="settings-group"><summary><span>🗂</span><div><b>หมวดค่าใช้จ่าย</b><small>เพิ่ม แก้ไข และลบหมวดสำหรับรายการจ่าย</small></div></summary><div class="settings-group-body"><div class="settings-group-head"><button type="button" class="btn secondary" onclick="openLookup('category')">+ เพิ่มหมวด</button></div>${lookupList(S.data.categories,'category')}</div></details><details class="settings-group"><summary><span>💳</span><div><b>ช่องทางการรับ–จ่าย</b><small>เพิ่ม แก้ไข และลบตัวเลือกบัญชีหรือช่องทางเงิน</small></div></summary><div class="settings-group-body"><div class="settings-group-head"><button type="button" class="btn secondary" onclick="openLookup('payment')">+ เพิ่มช่องทาง</button></div>${lookupList(S.data.paymentMethods,'payment')}</div></details>${users}</div>`}
function opts(items,label){return items.map(x=>`<option value="${x.id}">${esc(x[label])}</option>`).join('')} function modal(title,html,popupClass){Swal.fire({title,html,showConfirmButton:false,showCloseButton:true,allowOutsideClick:false,customClass:{popup:'mb-popup '+(popupClass||''),title:'mb-title',htmlContainer:'mb-html'}})} function closeModal(){Swal.close()} async function submit(action,data,msg){try{const result=await call(action,{data});S.data=result&&result.partial?Object.assign({},S.data,result):result;closeModal();render();showPage(S.page);if(S.page==='finance'&&['saveEmployee','saveSalaryAdvance','payMonthlySalary','saveOvertime'].includes(action))showFinanceTab('payroll');toast(msg)}catch(e){fireError(e.message)}}
function openPrimary(){({dashboard:openProject,projects:openProject,finance:openBatchExpense,documents:openQuotation,employees:openOvertime}[S.page]||openProject)()}
function openProjectTransactions(projectId){const p=S.data.projects.find(x=>x.id===projectId);if(!p)return fireError('ไม่พบโปรเจกต์');const rows=[...S.data.income.filter(x=>x.projectId===projectId).map(x=>({...x,_type:'INCOME',_label:'รับ',_amount:x.amountExVat,_channel:x.account})),...S.data.expenses.filter(x=>x.projectId===projectId).map(x=>({...x,_type:'EXPENSE',_label:'จ่าย',_amount:x.amountExVat,_channel:x.paidBy}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));modal('รายการรับ–จ่าย · '+p.name,`<div class="project-ledger-summary"><span><small>รายรับ</small><b class="positive">${money(p.income)}</b></span><span><small>รายจ่าย</small><b class="negative">${money(p.expenses)}</b></span><span><small>กำไร</small><b class="${p.profit<0?'negative':'positive'}">${money(p.profit)}</b></span></div><div class="project-ledger-table-wrap"><table class="project-ledger-table"><thead><tr><th>วันที่</th><th>ประเภท</th><th>รายละเอียด</th><th>ยอดเงิน</th><th>ช่องทาง</th><th>จัดการ</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="history-date">${esc(displayDate(x.date))}</td><td><span class="finance-type-badge ${x._type==='INCOME'?'income':''}">${x._label}</span></td><td>${esc(x.description||'-')}</td><td><b class="${x._type==='INCOME'?'positive':'negative'}">${x._type==='INCOME'?'+':'−'}${money(x._amount)}</b></td><td>${esc(x._channel||'-')}</td><td><div class="ledger-actions"><button type="button" onclick="openTransactionEditor('${x._type}','${x.id}')">แก้ไข</button><button type="button" class="delete" onclick="removeTransaction('${x._type}','${x.id}')">ลบ</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีรายการในโปรเจกต์นี้</td></tr>'}</tbody></table></div>`,'project-ledger-popup')}
function findTransaction(type,id){return(type==='INCOME'?S.data.income:S.data.expenses).find(x=>x.id===id)}

function importBulkColumn(){const input=$('bulkPasteInput'),status=$('bulkColumnStatus'),key=S.bulkTarget,raw=input?.value;if(!key){status.innerHTML='<div class="bulk-map-error">กรุณาเลือกหัวข้อที่จะลงก่อน</div>';return}if(!raw.trim()){status.innerHTML='<div class="bulk-map-error">กรุณาวางข้อมูลจาก Sheet ก่อน</div>';return}let values=raw.split(/\r?\n/);while(values.length&&values[values.length-1]==='')values.pop();if($('bulkSkipHeader')?.checked)values.shift();if(!values.length){status.innerHTML='<div class="bulk-map-error">ไม่พบข้อมูลสำหรับนำเข้า</div>';return}const rows=ensureBulkRows(values.length);values.forEach((value,index)=>{const row=rows[index],text=String(value).split('\t')[0].trim();if(key==='description')row.querySelector('[data-key="description"]').value=text;else if(key==='amount')row.querySelector('[data-key="amount"]').value=text.replace(/[,฿\s]/g,'');else if(key==='projectId'){const project=matchPastedProject(text);if(project)setProjectSearch(row,project.id);else{row.querySelector('[data-project-search]').value=text;row.querySelector('[data-key="projectId"]').value=''}}else if(key==='category'||key==='paidBy')setSelectIfAvailable(row,key,text);else if(key==='date')row.querySelector('[data-key="date"]').value=normalizePasteDate(text);else if(key==='type'){const type=text.toLowerCase();row.querySelector('[data-key="type"]').value=type.includes('รับ')||type.includes('income')?'INCOME':'EXPENSE';updateBatchRowType(row.querySelector('[data-key="type"]'))}});updateBatchExpenseTotal();input.value='';$('bulkSkipHeader').checked=false;status.innerHTML='<div class="bulk-column-success">✓ ลงข้อมูล '+values.length+' แถวแล้ว เลือกหัวข้อถัดไปและวางต่อได้เลย</div>';input.focus()}
function bulkMapOptions(selected){const fields=[['','— ไม่นำเข้าคอลัมน์นี้ —'],['description','รายละเอียด'],['amount','ยอดเงิน'],['projectId','หน้างาน'],['category','หมวด'],['paidBy','ช่องทาง'],['date','วันที่'],['type','ประเภท รับ/จ่าย']];return fields.map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
function prepareBulkMapping(){const raw=$('bulkPasteInput')?.value.trim(),area=$('bulkMappingArea');if(!raw){area.innerHTML='<div class="bulk-map-error">กรุณาวางข้อมูลจาก Sheet ก่อน</div>';return}const matrix=raw.split(/\r?\n/).filter(Boolean).map(line=>line.split('\t')),width=Math.max(...matrix.map(x=>x.length)),detected=Array.from({length:width},(_,i)=>bulkHeaderKey(matrix[0][i])),hasHeader=detected.filter(Boolean).length>=2;area.innerHTML=`<div class="bulk-map-head"><b>เลือกปลายทางของแต่ละคอลัมน์</b><label><input id="bulkHasHeader" type="checkbox" ${hasHeader?'checked':''}> แถวแรกเป็นหัวตาราง</label></div><div class="bulk-map-grid">${Array.from({length:width},(_,i)=>`<div class="bulk-map-card"><small>คอลัมน์ ${String.fromCharCode(65+i)}</small><b>${esc(matrix[0][i]||'(ว่าง)')}</b><span>ตัวอย่าง: ${esc((matrix[1]&&matrix[1][i])||'-')}</span><select data-map-index="${i}">${bulkMapOptions(detected[i])}</select></div>`).join('')}</div><div id="bulkMapError"></div><button type="button" class="btn full" onclick="importBulkPaste()">นำเข้าตามที่เลือก</button>`;const prepare=$('bulkPrepareBtn');if(prepare)prepare.classList.add('hidden')}
function bulkHeaderKey(value){const s=String(value||'').trim().toLowerCase().replace(/[\s_\-–—/]+/g,'');const aliases={description:['รายละเอียด','รายการ','description','detail'],amount:['ยอดเงิน','จำนวนเงิน','amount','ราคา'],projectId:['หน้างาน','โปรเจกต์','โครงการ','project'],category:['หมวด','หมวดหมู่','category'],paidBy:['ช่องทาง','จ่ายโดย','รับโดย','บัญชี','paidby','account'],date:['วันที่','date'],type:['ประเภท','รับจ่าย','type']};return Object.keys(aliases).find(k=>aliases[k].includes(s))||''}
function normalizePasteDate(value){const s=String(value||'').trim();if(!s)return today();if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){const [y,m,d]=s.split('-');return [y,m.padStart(2,'0'),d.padStart(2,'0')].join('-')}const match=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(match){let y=Number(match[3]);if(y>2400)y-=543;return [y,String(match[2]).padStart(2,'0'),String(match[1]).padStart(2,'0')].join('-')}return today()}

function filterFinanceHistory(){const projectId=$('financeHistoryProject')?.value||'',type=$('financeHistoryType')?.value||'',month=$('financeHistoryMonth')?.value||'',year=$('financeHistoryYear')?.value||'',rows=[...document.querySelectorAll('.finance-history-row')];let shown=0,income=0,expense=0;rows.forEach(row=>{const date=row.dataset.date||'',visible=(!projectId||row.dataset.project===projectId)&&(!type||row.dataset.type===type)&&(!year||date.slice(0,4)===year)&&(!month||date.slice(5,7)===month);row.classList.toggle('hidden',!visible);if(!visible)return;shown++;const amount=Number(row.dataset.amount||0);if(row.dataset.type==='รายรับ')income+=amount;else expense+=amount});const empty=$('financeHistoryEmpty'),count=$('financeHistoryCount'),incomeEl=$('financeHistoryIncome'),expenseEl=$('financeHistoryExpense'),netEl=$('financeHistoryNet'),net=income-expense;if(empty)empty.classList.toggle('hidden',shown>0);if(count)count.textContent=shown;if(incomeEl)incomeEl.textContent=money(income);if(expenseEl)expenseEl.textContent=money(expense);if(netEl){netEl.textContent=money(net);netEl.className=net<0?'negative':'positive'}}

#page-dashboard .financial-progress-legend em{background:#ffffffa8;border:1px solid #dce7eb;color:#405b68}
@media(max-width:520px){#page-dashboard{padding:8px;border-radius:15px}#page-dashboard .financial-progress{padding:9px}}
