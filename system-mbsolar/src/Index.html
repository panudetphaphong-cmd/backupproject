const INITIAL_DATA=<?!= initialData ?>;const now=new Date(),S={token:'',data:INITIAL_DATA,page:'dashboard',wageYear:String(now.getFullYear()),wageMonth:String(now.getMonth()+1).padStart(2,'0')}; const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10);
function setStatus(text,type='') {const el=$('syncStatus');if(!el)return;el.textContent=text;el.className='sync-status '+type} function call(action,data={}){loading(true);return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(done)return;done=true;loading(false);setStatus('เชื่อมต่อล้มเหลว','error');reject(new Error('เซิร์ฟเวอร์ใช้เวลานานเกิน 45 วินาที กรุณาลองใหม่'))},45000),finish=(fn,value,failed=false)=>{if(done)return;done=true;clearTimeout(timer);loading(false);setStatus(failed?'เกิดข้อผิดพลาด':'บันทึกสำเร็จ',failed?'error':'');fn(value)};google.script.run.withSuccessHandler(x=>finish(resolve,x)).withFailureHandler(e=>finish(reject,new Error(e.message||e),true)).api(action,{token:S.token,...data})})} function loading(v){setStatus(v?'กำลังบันทึก...':'พร้อมใช้งาน',v?'busy':'');if(v)Swal.fire({title:'กำลังบันทึกข้อมูล...',allowOutsideClick:false,allowEscapeKey:false,showConfirmButton:false,customClass:{popup:'mb-popup',title:'mb-title'},didOpen:()=>Swal.showLoading()});else if(Swal.isLoading())Swal.close()} function toast(t){setStatus('พร้อมใช้งาน');Swal.fire({toast:true,position:'top-end',icon:'success',title:t,showConfirmButton:false,timer:1800,timerProgressBar:true,background:'#fff',color:'#13231d'})} function fireError(t){setStatus('เกิดข้อผิดพลาด','error');return Swal.fire({icon:'error',title:'ไม่สามารถทำรายการได้',text:t,confirmButtonText:'ตกลง',confirmButtonColor:'#087a55',customClass:{popup:'mb-popup',title:'mb-title',confirmButton:'mb-confirm'}})} function can(p){return(S.data.permissions||[]).includes(p)}
async function login(e){e.preventDefault();enter()} async function init(){localStorage.removeItem('mb_token');if(S.data)enter();else fireError('ไม่พบข้อมูลเริ่มต้นจากเซิร์ฟเวอร์')} function enter(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=S.data.user.name;$('userRole').textContent='OWNER · โหมดทดสอบ';$('versionBadge').textContent='v'+(S.data.appVersion||'2.5.1');setStatus('พร้อมใช้งาน');render();showPage(S.page)} function logout(){location.reload()}
window.addEventListener('error',e=>{setStatus('JavaScript error: '+(e.message||'ไม่ทราบสาเหตุ'),'error');document.body.classList.remove('hidden')});window.addEventListener('unhandledrejection',e=>setStatus('เกิดข้อผิดพลาด: '+(e.reason?.message||e.reason||'ไม่ทราบสาเหตุ'),'error'));
const pageMeta={dashboard:['ภาพรวมกิจการ','กำไรจริงไม่รวม VAT','+ เพิ่มโปรเจกต์'],projects:['โปรเจกต์ทั้งหมด','เพิ่ม แก้ไข หรือลบโปรเจกต์','+ เพิ่มโปรเจกต์'],finance:['การเงินและบุคลากร','รายการรับ–จ่าย เงินเดือน และ OT',''],loan:['คำนวณการผ่อน','กรอกครั้งเดียว เปรียบเทียบโปรโมชั่นทุกธนาคาร',''],settings:['ตั้งค่าระบบ','หมวดค่าใช้จ่าย ช่องทางจ่าย และผู้ใช้งาน','']};
function showPage(p){S.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$('page-'+p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));const m=pageMeta[p];$('pageTitle').textContent=m[0];$('pageSub').textContent=m[1];$('primaryBtn').textContent=m[2];$('primaryBtn').classList.toggle('hidden',p==='settings'||p==='loan'||!m[2]);if(p==='loan')calcLoan()}
function render(){[['ภาพรวม',renderDashboard],['โปรเจกต์',renderProjects],['การเงิน',renderFinance],['คำนวณผ่อน',renderLoan],['ตั้งค่า',renderSettings]].forEach(([name,fn])=>{try{fn()}catch(e){console.error(name,e);const page=document.querySelector('#page-'+({ภาพรวม:'dashboard',โปรเจกต์:'projects',การเงิน:'finance','คำนวณผ่อน':'loan',ตั้งค่า:'settings'}[name]));if(page)page.innerHTML=`<div class="card empty">ส่วน${name}แสดงผลไม่สำเร็จ กรุณารีเฟรชหน้า<br><small>${esc(e.message||e)}</small></div>`}})}
function financeChannel(name){const text=String(name||'').trim(),account=(S.data.balanceAccounts||[]).find(x=>x.name===text);if(account)return account.type;if(text.includes('เงินสด'))return'CASH';if(text.includes('บัญชีบริษัท')||text.includes('บริษัท'))return'COMPANY';return''}
function realBalanceSummary(){const accounts=(S.data.balanceAccounts||[]).map(x=>({...x,balance:Number(x.openingBalance)||0}));const find=name=>accounts.find(x=>x.name===String(name||'').trim());(S.data.income||[]).forEach(x=>{const a=find(x.account);if(a)a.balance+=Number(x.total!=null?x.total:x.amountExVat)||0});(S.data.expenses||[]).forEach(x=>{const a=find(x.paidBy);if(a)a.balance-=Number(x.total!=null?x.total:x.amountExVat)||0});(S.data.dividends||[]).forEach(x=>{const a=find(x.paidFrom);if(a)a.balance-=Number(x.amount)||0});const cash=accounts.filter(x=>x.type==='CASH').reduce((s,x)=>s+x.balance,0),company=accounts.filter(x=>x.type==='COMPANY').reduce((s,x)=>s+x.balance,0);return{accounts,CASH:cash,COMPANY:company,total:cash+company}}
function renderDashboard(){const t=S.data.totals,ps=S.data.projects,ordered=[...ps].sort((a,b)=>(Number(a.dividendPaid)>0)-(Number(b.dividendPaid)>0)),cash=realBalanceSummary(),accountRows=cash.accounts.map(a=>`<div class="balance-account-row"><span>${esc(a.name)}</span><b class="${a.balance<0?'negative':'positive'}">${money(a.balance)}</b></div>`).join('');$('page-dashboard').innerHTML=`<div class="metrics"><div class="card metric"><small>มูลค่างานรวม</small><b>${money(t.contract)}</b></div><div class="card metric"><small>รับเงินจริงก่อน VAT</small><b class="positive">${money(t.income)}</b></div><div class="card metric"><small>ต้นทุนรวม</small><b class="negative">${money(t.expenses)}</b></div><div class="card metric"><small>กำไรรวม</small><b class="${t.profit<0?'negative':'positive'}">${money(t.profit)}</b></div></div><section class="real-balance-panel"><div class="real-balance-head"><div><small>ทรัพย์สินหมุนเวียนของบริษัท</small><h3>เงินคงเหลือจริง</h3></div><b class="${cash.total<0?'negative':'positive'}">${money(cash.total)}</b></div><div class="real-balance-grid"><div class="cash"><span class="balance-icon">฿</span><div><small>เงินสดรวม</small><b class="${cash.CASH<0?'negative':'positive'}">${money(cash.CASH)}</b></div></div><div class="company"><span class="balance-icon">▣</span><div><small>บัญชีบริษัทรวม</small><b class="${cash.COMPANY<0?'negative':'positive'}">${money(cash.COMPANY)}</b></div></div></div>${accountRows?`<div class="balance-account-list">${accountRows}</div>`:''}<p>ยอดปันผลจะถูกหักออกจากบัญชีที่เลือก และไม่รวมในยอดบริษัทอีก</p></section><div class="section-head"><h3>กำไรแต่ละโปรเจกต์</h3><span class="muted">${ps.length} โปรเจกต์</span></div><div class="project-grid">${ordered.length?ordered.map(projectCard).join(''):'<div class="card empty">ยังไม่มีโปรเจกต์ เริ่มจากเพิ่มโปรเจกต์แรก</div>'}</div>`}
function projectStatus(status){const key=String(status||'PLANNING').toUpperCase(),map={PLANNING:{label:'วางแผน',cls:'planning'},ACTIVE:{label:'กำลังดำเนินงาน',cls:'active'},COMPLETED:{label:'เสร็จแล้ว',cls:'completed'}};return map[key]||{label:status||'ไม่ระบุ',cls:'other'}}
function projectCard(p){const status=projectStatus(p.status),income=Math.max(0,Number(p.income)||0),expense=Math.max(0,Number(p.expenses)||0),profit=income-expense,expensePct=income?expense/income*100:(expense?100:0),expenseWidth=Math.max(0,Math.min(100,expensePct)),over=expense>income,dividend=Number(p.dividendPaid)||0;return`<article class="card dashboard-project status-card finance-progress-card ${dividend>0?'dividend-complete':''}"><div class="status-card-info"><div><h3>${esc(p.name)}</h3><small>${esc(p.customer||'ยังไม่ระบุลูกค้า')}</small></div><div class="status-card-badges"><span class="project-status ${status.cls}"><i></i>${esc(status.label)}</span></div></div><div class="financial-progress"><div class="financial-progress-head"><span>รายรับจริงปัจจุบัน</span><b>${money(income)}</b></div><div class="financial-progress-track ${over?'over':''}" aria-label="รายจ่าย ${expensePct.toFixed(1)} เปอร์เซ็นต์ของรายรับ"><i class="expense" style="width:${expenseWidth}%"></i><i class="profit" style="width:${over?0:100-expenseWidth}%"></i></div><div class="financial-progress-legend"><span class="expense"><i></i><small>รายจ่ายจริง</small><b>${money(expense)}</b></span><span class="profit ${over?'negative':''}"><i></i><small>${over?'ขาดทุน':'กำไรปัจจุบัน'}</small><b>${money(Math.abs(profit))}</b></span><em>${expensePct.toFixed(1)}%</em></div></div>${dividend>0?`<div class="dividend-complete-footer"><span>✓ ปันผลเรียบร้อยแล้ว</span><b>${money(dividend)}</b></div>`:''}</article>`}
function openProjectOverview(projectId){const p=S.data.projects.find(x=>x.id===projectId);if(!p)return fireError('ไม่พบโปรเจกต์');const status=projectStatus(p.status),contract=Number(p.contractValue)||0,cost=Number(p.expenses)||0,cashProfit=Number(p.profit)||0,dividend=Number(p.dividendPaid)||0;modal('รายละเอียดโปรเจกต์',`<div class="project-overview-modal"><div class="project-overview-title"><span class="project-status ${status.cls}"><i></i>${esc(status.label)}</span><h3>${esc(p.name)}</h3><small>${esc(p.customer||'ยังไม่ระบุลูกค้า')}</small></div><div class="project-overview-values"><div><small>มูลค่าโครงการ</small><b>${money(contract)}</b></div><div><small>รับเงินจริงแล้ว</small><b class="positive">${money(p.income)}</b></div><div><small>ค่าใช้จ่าย</small><b class="negative">${money(cost)}</b></div><div><small>กำไรรับ–จ่าย</small><b class="${cashProfit<0?'negative':'positive'}">${money(cashProfit)}</b></div>${dividend>0?`<div><small>ปันผลแล้ว</small><b class="negative">${money(dividend)}</b></div><div><small>กำไรหลังปันผล</small><b class="${Number(p.profitAfterDividend)<0?'negative':'positive'}">${money(p.profitAfterDividend)}</b></div>`:''}</div>${p.note?`<div class="hint"><b>หมายเหตุ</b><br>${esc(p.note)}</div>`:''}</div>`)}
function renderProjects(){$('page-projects').innerHTML=`<div class="project-grid">${S.data.projects.length?S.data.projects.map(p=>{const st=projectStatus(p.status);return`<article class="card project"><span class="project-status ${st.cls}"><i></i>${esc(st.label)}</span><h3>${esc(p.name)}</h3><div class="muted">${esc(p.customer||'ยังไม่ระบุลูกค้า')}</div><div class="numbers"><div><small>รายรับ</small><b class="positive">+${money(p.income)}</b></div><div><small>ต้นทุน</small><b class="negative">-${money(p.expenses)}</b></div><div><small>กำไร</small><b class="${p.profit<0?'negative':'positive'}">${money(p.profit)}</b></div></div><div class="project-actions"><button type="button" class="btn project-ledger-btn" onclick="openProjectTransactions('${p.id}')">รายการรับ–จ่าย</button><button type="button" class="btn secondary" onclick="openProject('${p.id}')">แก้ไขโปรเจกต์</button><button type="button" class="btn danger" onclick="removeProject('${p.id}')">ลบ</button></div></article>`}).join(''):'<div class="card empty">ยังไม่มีข้อมูล</div>'}</div>`}
function pname(id){return(S.data.projects.find(x=>x.id===id)||{}).name||'-'} function ename(id){return(S.data.employees.find(x=>x.id===id)||{}).name||'-'}
function renderFinance(){const rows=[...S.data.income.map(x=>({...x,type:'รายรับ',desc:x.description,amount:x.amountExVat})),...S.data.expenses.map(x=>({...x,type:'รายจ่าย',desc:x.description,amount:x.amountExVat}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('page-finance').innerHTML=`<div class="finance-tabs"><button class="active" data-ftab="transactions" onclick="showFinanceTab('transactions')">รายการรับ–จ่าย</button><button data-ftab="payroll" onclick="showFinanceTab('payroll')">พนักงานและเงินเดือน</button><button data-ftab="dividends" onclick="showFinanceTab('dividends')">ปันผลหุ้นส่วน</button><button data-ftab="balances" onclick="showFinanceTab('balances')">ตั้งค่าเงินคงเหลือ</button></div><section id="finance-transactions"><div class="card finance-entry-card"><div class="finance-entry-head"><div><b>ลงรายการรับ–จ่าย</b><small>กรอกใหม่หรือดึงรายการจากประวัติขึ้นมาแก้ไข</small></div></div>${batchExpenseFormHtml()}</div><details class="finance-history"><summary><span><b>ประวัติรายการย้อนหลัง</b><small>${rows.length} รายการ</small></span><i>เปิดดู</i></summary><div class="card finance-ledger"><div class="history-project-filter"><label>เลือกโปรเจกต์</label><select onchange="filterFinanceHistory(this.value)"><option value="">ทุกโปรเจกต์</option>${S.data.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>ประเภท</th><th>หน้างาน</th><th>รายละเอียด</th><th>ช่องทาง</th><th>ยอดเงิน</th><th>แก้ไข</th></tr></thead><tbody>${rows.map(x=>`<tr class="finance-history-row ${x.type==='รายรับ'?'finance-row-income':'finance-row-expense'}" data-project="${x.projectId}"><td>${esc(x.date)}</td><td><span class="finance-type-badge">${x.type}</span></td><td>${esc(pname(x.projectId))}</td><td>${esc(x.desc)}</td><td>${esc(x.account||x.paidBy||'-')}</td><td><b>${x.type==='รายรับ'?'+':'−'}${money(x.total)}</b></td><td><button type="button" class="history-edit-btn" onclick="loadTransactionIntoEntry('${x.type==='รายรับ'?'INCOME':'EXPENSE'}','${x.id}')">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีรายการ</td></tr>'}</tbody></table></div><div id="financeHistoryEmpty" class="empty hidden">ไม่พบรายการของโปรเจกต์นี้</div></div></details></section><section id="finance-payroll" class="hidden">${employeeContent()}</section><section id="finance-dividends" class="hidden">${dividendContent()}</section><section id="finance-balances" class="hidden">${balanceSettingsContent()}</section>`}
function showFinanceTab(tab){['transactions','payroll','dividends','balances'].forEach(x=>$('finance-'+x).classList.toggle('hidden',x!==tab));document.querySelectorAll('[data-ftab]').forEach(x=>x.classList.toggle('active',x.dataset.ftab===tab));$('primaryBtn').classList.add('hidden')}
function balanceSettingsContent(){const summary=realBalanceSummary();return`<div class="section-head"><div><h3>ตั้งค่าเงินคงเหลือ</h3><span class="muted">จัดการเงินสดและบัญชีบริษัทหลายบัญชี</span></div><button class="btn" onclick="openBalanceAccount()">+ เพิ่มบัญชี</button></div><div class="balance-settings-grid">${summary.accounts.map(a=>`<article class="card balance-setting-card"><div><span class="tag">${a.type==='CASH'?'เงินสด':'บัญชีบริษัท'}</span><h3>${esc(a.name)}</h3><small>ยอดตั้งต้น ${money(a.openingBalance||0)}</small></div><b class="${a.balance<0?'negative':'positive'}">${money(a.balance)}</b><div class="balance-setting-actions"><button class="btn secondary" onclick="openBalanceAccount('${a.id}')">แก้ไข</button><button class="btn danger" onclick="removeBalanceAccount('${a.id}')">ลบ</button></div></article>`).join('')||'<div class="card empty">ยังไม่มีบัญชี</div>'}</div><div class="hint">ยอดปัจจุบันคำนวณจากยอดตั้งต้น รวมกับรายการรับ–จ่ายและเงินปันผลของบัญชีนั้นโดยอัตโนมัติ</div>`}
function dividendContent(){const paid=S.data.dividends.reduce((s,x)=>s+Number(x.amount||0),0),available=Math.max(0,S.data.totals.profit-paid),completed=S.data.projects.filter(x=>String(x.status).toUpperCase()==='COMPLETED');return`<div class="metrics" style="margin-bottom:16px"><div class="card metric"><small>กำไรรวมก่อนปันผล</small><b>${money(S.data.totals.profit)}</b></div><div class="card metric"><small>จ่ายปันผลแล้ว</small><b class="negative">${money(paid)}</b></div><div class="card metric"><small>กำไรคงเหลือสำหรับปันผล</small><b class="positive">${money(available)}</b></div><div class="card metric"><small>โปรเจกต์ที่เสร็จแล้ว</small><b>${completed.length}</b></div></div><div class="section-head dividend-section-head"><h3>ปันผลกำไรโปรเจกต์ 50/50</h3><span class="muted">บาส 50% · กอล์ฟ 50%</span></div><div class="dividend-project-grid">${completed.map(p=>{const remaining=Math.max(0,Number(p.profitAfterDividend!=null?p.profitAfterDividend:p.profit)||0),distributed=(Number(p.dividendPaid)||0)>0&&remaining<=0;return`<article class="card dividend-project-card"><div><span class="project-status completed"><i></i>เสร็จแล้ว</span><h3>${esc(p.name)}</h3><small>${esc(p.customer||'ไม่ระบุลูกค้า')}</small></div><div class="dividend-project-numbers"><span><small>กำไรก่อนปันผล</small><b>${money(p.profit)}</b></span><span><small>ปันผลแล้ว</small><b class="negative">${money(p.dividendPaid||0)}</b></span><span><small>เหลือปันผล</small><b class="positive">${money(remaining)}</b></span></div><button type="button" class="btn ${distributed?'secondary':''}" onclick="openProjectDividend('${p.id}')" ${remaining>0?'':'disabled'}>${distributed?'✓ ปันผลครบแล้ว':'แบ่งกำไร 50/50'}</button></article>`}).join('')||'<div class="card empty">ยังไม่มีโปรเจกต์สถานะเสร็จแล้ว</div>'}</div><div class="section-head dividend-section-head"><h3>ยอดที่หุ้นส่วนได้รับ</h3></div><div class="grid2">${S.data.partners.map(p=>`<div class="card partner-dividend-card"><div class="salary-head"><div><div class="muted">หุ้นส่วน</div><b style="font-size:20px">${esc(p.name)}</b></div><div class="partner-paid-total"><small>ได้รับแล้ว</small><b>${money(p.totalPaid)}</b></div></div>${p.payments.slice(0,10).map(x=>`<div class="advance-row"><span>${esc(x.date)} · ${x.projectId?esc(pname(x.projectId)):'รายการเดิม'}<br><small class="muted">จาก ${esc(x.paidFrom||'-')}</small></span><b class="positive">+${money(x.amount)}</b></div>`).join('')||'<div class="empty">ยังไม่ได้รับปันผล</div>'}</div>`).join('')}</div>`}

function renderLoan(){S.selectedBank=S.selectedBank||'GSB';S.loanDraft=S.loanDraft||{price:'',downPercent:0};S.customDraft=S.customDraft||{name:'แผนกำหนดเอง',type:'FLAT',rate:5};$('page-loan').innerHTML=`<div class="loan-calculator"><section class="card loan-bank-section"><div class="loan-step"><span>1</span><div><b>เลือกธนาคาร</b><small>เลือกก่อนเพื่อใช้อัตราดอกเบี้ยของธนาคารนั้น</small></div></div><div class="loan-bank-picker">${BANK_PRODUCTS.map(b=>`<button type="button" class="loan-bank-btn ${S.selectedBank===b.id?'active':''}" style="--bank-color:${b.color}" onclick="selectLoanBank('${b.id}')"><span class="bank-mark">${esc(b.mark)}</span><span><b>${esc(b.id)}</b><small>${esc(b.name)}</small></span>${b.available?'':'<i>รอเรต</i>'}</button>`).join('')}</div></section><section class="card loan-input-section"><div class="loan-step"><span>2</span><div><b>ราคาและเงินดาวน์</b><small>ราคาที่กรอกเป็นราคาขายสุดท้าย ระบบจะหักเฉพาะดาวน์ของลูกค้า</small></div></div><div class="loan-input-grid"><div class="field"><label>ราคาขายสุดท้าย (บาท)</label><input id="loanPrice" type="number" value="${S.loanDraft.price}" min="0" step="1000" oninput="calcLoan()"></div><div class="field"><label>ลูกค้าดาวน์ (%)</label><input id="loanDownPercent" type="number" value="${S.loanDraft.downPercent}" min="0" max="100" step="1" oninput="calcLoan()"></div><div class="loan-down-summary"><small>เงินดาวน์</small><b id="loanDownAmount">฿0</b></div><div class="loan-down-summary primary"><small>ยอดจัดสินเชื่อ</small><b id="loanPrincipal">฿0</b></div></div><div class="loan-quick-down"><span>เลือกเร็ว:</span>${[0,10,20,30].map(x=>`<button type="button" onclick="setDownPercent(${x})">${x}%</button>`).join('')}</div>${S.selectedBank==='CUSTOM'?`<div class="custom-loan-settings"><div class="field"><label>ชื่อแผน</label><input id="customPlanName" value="${esc(S.customDraft.name)}" oninput="calcLoan()"></div><div class="field"><label>ประเภทดอกเบี้ย</label><select id="customInterestType" onchange="calcLoan()"><option value="FLAT" ${S.customDraft.type==='FLAT'?'selected':''}>Flat Rate</option><option value="REDUCING" ${S.customDraft.type==='REDUCING'?'selected':''}>ลดต้นลดดอก</option></select></div><div class="field"><label>ดอกเบี้ยต่อปี (%)</label><input id="customAnnualRate" type="number" value="${S.customDraft.rate}" min="0" max="100" step="0.01" oninput="calcLoan()"></div></div>`:''}</section><section class="card loan-table-section"><div class="loan-step"><span>3</span><div><b>ตารางระยะผ่อน 3–7 ปี</b><small id="loanPlanName">ค่างวดโดยประมาณของธนาคารที่เลือก</small></div></div><div id="bankResults"></div></section></div>`;calcLoan()}
function selectLoanBank(id){S.loanDraft={price:$('loanPrice')?.value||'',downPercent:Math.min(100,Math.max(0,Number($('loanDownPercent')?.value)||0))};if($('customPlanName'))S.customDraft={name:$('customPlanName').value||'แผนกำหนดเอง',type:$('customInterestType').value,rate:Math.max(0,Number($('customAnnualRate').value)||0)};S.selectedBank=id;renderLoan()}
function setDownPercent(percent){if($('loanDownPercent'))$('loanDownPercent').value=percent;calcLoan()}
function amortizeSteps(principal,years,steps){let balance=principal,totalPaid=0,firstPayment=0,used=0;const totalMonths=years*12;for(const step of steps){const count=Math.min(step.months,totalMonths-used);if(count<=0)break;const remaining=totalMonths-used,r=step.rate/1200,payment=r?balance*r*Math.pow(1+r,remaining)/(Math.pow(1+r,remaining)-1):balance/remaining;if(!firstPayment)firstPayment=payment;for(let i=0;i<count;i++){const interest=balance*r;balance=Math.max(0,balance-(payment-interest));totalPaid+=payment}used+=count}return{monthly:firstPayment,total:totalPaid,balance}}
function calcLoan(){
  if(!$('loanPrice')||!$('bankResults'))return;
  const price=Math.max(0,Number($('loanPrice').value)||0),downPercent=Math.min(100,Math.max(0,Number($('loanDownPercent').value)||0)),customerDown=price*downPercent/100,principal=Math.max(0,price-customerDown),base=BANK_PRODUCTS.find(x=>x.id===S.selectedBank)||BANK_PRODUCTS[0];
  if(base.custom)S.customDraft={name:$('customPlanName')?.value||'แผนกำหนดเอง',type:$('customInterestType')?.value||'FLAT',rate:Math.max(0,Number($('customAnnualRate')?.value)||0)};
  const b=base.custom?Object.assign({},base,{name:S.customDraft.name,plan:(S.customDraft.type==='FLAT'?'Flat Rate ':'ลดต้นลดดอก ')+S.customDraft.rate.toFixed(2)+'% ต่อปี',interestType:S.customDraft.type==='FLAT'?'FLAT':'REDUCING',annualRate:S.customDraft.rate,rates:[{months:84,rate:S.customDraft.rate}],rateLabels:[S.customDraft.rate.toFixed(2)+'% '+(S.customDraft.type==='FLAT'?'Flat Rate':'ลดต้นลดดอก')]}):base;
  $('loanDownAmount').textContent=money(customerDown);$('loanPrincipal').textContent=money(principal);$('loanPlanName').textContent=b.name+' · '+b.plan;
  if(!b.available){$('bankResults').innerHTML=`<div class="loan-rate-empty"><div class="bank-mark" style="background:${b.color}">${esc(b.mark)}</div><b>ยังไม่มีข้อมูลอัตราดอกเบี้ย ${esc(b.name)}</b><span>ส่งภาพหรือรายละเอียดโปรโมชั่นมาได้ ระบบจะเพิ่มตาราง 3–7 ปีในตำแหน่งนี้</span></div>`;return}
  const warnings=[];
  if(Number.isFinite(b.maxLoan)&&principal>b.maxLoan)warnings.push(`ยอดจัดเกินวงเงินสูงสุด ${money(b.maxLoan)} อยู่ ${money(principal-b.maxLoan)}`);
  if(downPercent<(b.minDownRate||0))warnings.push(`โปรโมชั่นธนาคารระบุดาวน์ขั้นต่ำ ${b.minDownRate}% โปรดตรวจเงื่อนไขก่อนยื่น`);
  const termCards=[3,4,5,6,7].map(years=>{const result=b.interestType==='FLAT'?(()=>{const total=principal*(1+(b.annualRate/100)*years);return{monthly:total/(years*12),total}})():amortizeSteps(principal,years,b.rates),interest=Math.max(0,result.total-principal);return`<article class="loan-term-card"><div class="loan-term-head"><b>${years} ปี</b><span>${years*12} งวด</span><em>${esc(b.name)}</em></div><div class="loan-term-context"><span>ยอดจัดสินเชื่อ</span><span><b>${money(principal)}</b></span></div><div class="loan-term-main"><small>ค่างวดต่อเดือน</small><strong>${money(result.monthly)}</strong></div><div class="loan-term-stat interest"><small>ดอกเบี้ยรวมประมาณการ</small><b>${money(interest)}</b></div><div class="loan-term-stat total"><small>ยอดชำระรวม</small><b>${money(result.total)}</b></div></article>`}).join('');
  const rateStrip=(b.rateLabels||[]).map(label=>{const parts=label.split(' ');return`<span><b>${esc(parts.shift())}</b> ${esc(parts.join(' '))}</span>`}).join('');
  const methodNote=b.interestType==='FLAT'?'คำนวณแบบ Flat Rate จากเงินต้นเต็มตลอดสัญญา':b.id==='GSB'?'ค่างวดเป็นการประมาณแบบลดต้นลดดอก และอาจปรับเมื่อเข้าสู่ช่วงอัตราดอกเบี้ยใหม่หรือ MRR เปลี่ยนแปลง':b.custom?'คำนวณแบบลดต้นลดดอกจากอัตราที่กำหนดเอง':'คำนวณแบบลดต้นลดดอกโดยใช้เรทชั่วคราว 3.25% ตลอดระยะสัญญา โปรดอัปเดตเมื่อได้รับเรทจริง';
  $('bankResults').innerHTML=`${warnings.length?`<div class="loan-warning">${warnings.join(' · ')}</div>`:''}<div class="loan-selection-summary"><div><small>ธนาคาร / แผนที่เลือก</small><b>${esc(b.name)}</b></div><div><small>ยอดจัดสินเชื่อ</small><b>${money(principal)}</b></div><div><small>เงินดาวน์ ${downPercent}%</small><b>${money(customerDown)}</b></div></div><div class="loan-rate-strip">${rateStrip}</div><div class="loan-term-grid">${termCards}</div><div class="bank-note">${methodNote}</div>`
}

function saveProjectFast(event,form){event.preventDefault();const data=Object.fromEntries(new FormData(form)),editing=!!data.id,page=S.page;Swal.close();setStatus(editing?'กำลังแก้ไขโปรเจกต์...':'กำลังเพิ่มโปรเจกต์...','busy');let finished=false;const timer=setTimeout(()=>{if(finished)return;finished=true;setStatus('บันทึกโปรเจกต์ไม่สำเร็จ: หมดเวลา','error');fireError('เซิร์ฟเวอร์ใช้เวลานานเกิน 30 วินาที กรุณาลองอีกครั้ง')},30000);google.script.run.withSuccessHandler(result=>{if(finished)return;finished=true;clearTimeout(timer);try{if(!result||!Array.isArray(result.projects))throw new Error('เซิร์ฟเวอร์ส่งข้อมูลโปรเจกต์กลับมาไม่ครบ');S.data=result.partial?Object.assign({},S.data,result):result;renderDashboard();renderProjects();showPage(page);setStatus('บันทึกโปรเจกต์สำเร็จ');toast(editing?'แก้ไขโปรเจกต์แล้ว':'เพิ่มโปรเจกต์แล้ว')}catch(err){setStatus('แสดงผลโปรเจกต์ไม่สำเร็จ','error');fireError(err.message)}}).withFailureHandler(err=>{if(finished)return;finished=true;clearTimeout(timer);setStatus('บันทึกโปรเจกต์ไม่สำเร็จ','error');fireError(err.message||String(err))}).api('saveProject',{token:S.token,data})}

function batchExpenseFormHtml(){return`<form class="batch-expense-form" onsubmit="submitBatchExpenses(event)"><div class="batch-help"><span>เลือก “รับ” หรือ “จ่าย” แยกแต่ละแถวได้</span></div><div class="batch-table-wrap"><table class="batch-expense-table"><thead><tr><th>ลำดับ</th><th>รายละเอียด</th><th>ยอดเงิน</th><th>หน้างาน</th><th>หมวด</th><th>ช่องทาง</th><th>วันที่</th><th>ประเภท</th><th></th></tr></thead><tbody id="batchExpenseBody">${Array.from({length:10},(_,i)=>batchExpenseRow(i+1)).join('')}</tbody></table></div><div class="batch-footer"><button type="button" class="btn secondary" onclick="addBatchExpenseRow()">+ เพิ่มแถว</button><div class="batch-totals"><span><small>รับรวม</small><b id="batchIncomeTotal">฿0.00</b></span><span><small>จ่ายรวม</small><b id="batchExpenseTotal">฿0.00</b></span></div><button class="btn finance-batch-save" type="submit">บันทึกทั้งหมด</button></div></form>`}

function renumberBatchExpenseRows(){document.querySelectorAll('#batchExpenseBody .batch-seq').forEach((x,i)=>x.textContent=i+1)}
function addBatchExpenseRow(){const dates=document.querySelectorAll('#batchExpenseBody [data-key="date"]'),lastDate=dates.length?dates[dates.length-1].value:today();document.querySelector('#batchExpenseBody').insertAdjacentHTML('beforeend',batchExpenseRow(null,lastDate));renumberBatchExpenseRows()}

function removeBatchExpenseRow(btn){const rows=document.querySelectorAll('#batchExpenseBody tr');if(rows.length===1){rows[0].querySelectorAll('input').forEach(x=>x.value=x.type==='date'?today():'');updateBatchExpenseTotal();return}btn.closest('tr').remove();renumberBatchExpenseRows();updateBatchExpenseTotal()}
function updateBatchExpenseTotal(){let income=0,expense=0;document.querySelectorAll('#batchExpenseBody tr').forEach(row=>{const amount=Number(row.querySelector('[data-key="amount"]').value)||0,type=row.querySelector('[data-key="type"]').value;if(type==='INCOME')income+=amount;else expense+=amount});const inc=$('batchIncomeTotal'),exp=$('batchExpenseTotal');if(inc)inc.textContent=money(income);if(exp)exp.textContent=money(expense)}
function filterFinanceHistory(projectId){const rows=[...document.querySelectorAll('.finance-history-row')];let shown=0;rows.forEach(row=>{const visible=!projectId||row.dataset.project===projectId;row.classList.toggle('hidden',!visible);if(visible)shown++});const empty=$('financeHistoryEmpty');if(empty)empty.classList.toggle('hidden',shown>0)}
function loadTransactionIntoEntry(type,id){const x=findTransaction(type,id);if(!x)return fireError('ไม่พบรายการ');const rows=[...document.querySelectorAll('#batchExpenseBody tr')],row=rows.find(r=>!r.dataset.editId&&!r.querySelector('[data-key="description"]').value&&!r.querySelector('[data-key="amount"]').value)||rows[0];row.dataset.editId=id;row.classList.add('editing');const set=(key,value)=>{const el=row.querySelector(`[data-key="${key}"]`);if(el)el.value=value==null?'':value};set('description',x.description);set('amount',x.amountExVat);set('projectId',x.projectId);set('category',x.category||'');set('paidBy',type==='INCOME'?x.account:x.paidBy);set('date',x.date);set('type',type);const typeSelect=row.querySelector('[data-key="type"]');typeSelect.disabled=true;updateBatchRowType(typeSelect);row.querySelector('.batch-seq').innerHTML=`<span class="editing-label">กำลังแก้</span>`;document.querySelector('.finance-entry-card').scrollIntoView({behavior:'smooth',block:'start'});toast('ดึงรายการขึ้นตารางแล้ว แก้ไขและกดบันทึกทั้งหมด')}
async function submitBatchExpenses(event){event.preventDefault();const rows=[...document.querySelectorAll('#batchExpenseBody tr')],items=rows.map(row=>Object.assign(Object.fromEntries([...row.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,x.value])),row.dataset.editId?{id:row.dataset.editId}:{})).filter(x=>x.description||Number(x.amount));if(!items.length)return fireError('กรุณากรอกอย่างน้อย 1 รายการ');await submit('saveTransactionsBatch',{items},'บันทึกและอัปเดต '+items.length+' รายการแล้ว')}

function saveEmployeeFast(event,form){event.preventDefault();const data=Object.fromEntries(new FormData(form)),editing=!!data.id;Swal.close();setStatus(editing?'กำลังแก้ไขพนักงาน...':'กำลังเพิ่มพนักงาน...','busy');let finished=false;const timer=setTimeout(()=>{if(finished)return;finished=true;setStatus('บันทึกพนักงานไม่สำเร็จ: หมดเวลา','error');fireError('เซิร์ฟเวอร์ใช้เวลานานเกิน 20 วินาที แต่หน้าเว็บยังใช้งานต่อได้')},20000);google.script.run.withSuccessHandler(result=>{if(finished)return;finished=true;clearTimeout(timer);try{S.data=result&&result.partial?Object.assign({},S.data,result):result;renderFinance();showPage('finance');showFinanceTab('payroll');setStatus('บันทึกพนักงานสำเร็จ');toast(editing?'แก้ไขพนักงานแล้ว':'เพิ่มพนักงานแล้ว')}catch(err){setStatus('แสดงผลไม่สำเร็จ','error');fireError(err.message)}}).withFailureHandler(err=>{if(finished)return;finished=true;clearTimeout(timer);setStatus('บันทึกพนักงานไม่สำเร็จ','error');fireError(err.message||String(err))}).api('saveEmployee',{token:'',data})}
function openOvertime(employeeId){const e=S.data.employees.find(x=>x.id===employeeId);if(!e)return fireError('ไม่พบพนักงาน');modal('เพิ่ม OT · '+e.name,`<form onsubmit="event.preventDefault();submit('saveOvertime',Object.fromEntries(new FormData(this)),'บันทึก OT แล้ว')"><input type="hidden" name="employeeId" value="${e.id}"><div class="hint"><b>${esc(e.name)}</b> · ${esc(e.position||'ไม่ระบุตำแหน่ง')}</div><div class="field"><label>โปรเจกต์ที่ทำ OT</label><select name="projectId" required>${opts(S.data.projects,'name')}</select></div><div class="form-grid"><div class="field"><label>วันที่ทำ OT</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>จำนวนชั่วโมง</label><input name="hours" type="number" min=".25" step=".25" placeholder="เช่น 2.5" required></div><div class="field"><label>อัตรา OT ต่อชั่วโมง</label><input name="rate" type="number" min="1" placeholder="กำหนดครั้งนี้" required></div></div><div class="field"><label>รายละเอียดงาน</label><input name="note" placeholder="ระบุงานที่ทำเพิ่มเติม"></div><button class="btn full">บันทึก OT ของ ${esc(e.name)}</button></form>`)}

function openProjectDividend(projectId){const p=S.data.projects.find(x=>x.id===projectId);if(!p)return fireError('ไม่พบโปรเจกต์');const remaining=Math.max(0,Number(p.profitAfterDividend!=null?p.profitAfterDividend:p.profit)||0);if(remaining<=0)return fireError('โปรเจกต์นี้ปันผลครบแล้ว');const half=remaining/2,sources=S.data.balanceAccounts||[];if(!sources.length)return fireError('กรุณาเพิ่มบัญชีในเมนูตั้งค่าเงินคงเหลือ');modal('แบ่งกำไร 50/50',`<form onsubmit="submitProjectDividend(event,this)"><input type="hidden" name="projectId" value="${p.id}"><div class="dividend-confirm-project"><small>โปรเจกต์</small><b>${esc(p.name)}</b><span>กำไรที่นำมาปันผล ${money(remaining)}</span></div><div class="dividend-split-preview"><div><small>บาสได้รับ 50%</small><b>${money(half)}</b></div><div><small>กอล์ฟได้รับ 50%</small><b>${money(remaining-half)}</b></div></div><div class="form-grid"><div class="field"><label>วันที่ปันผล</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>หักเงินออกจาก</label><select name="paidFrom" required>${sources.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div></div><div class="field"><label>หมายเหตุ</label><input name="note" value="ปันผลกำไรโครงการ 50/50"></div><button type="submit" class="btn full">ยืนยันแบ่งให้บาสและกอล์ฟ</button></form>`)}

function updateDividendProjectInfo(projectId){const p=S.data.projects.find(x=>x.id===projectId);if(!p)return;const available=Math.max(0,Number(p.profitAfterDividend!=null?p.profitAfterDividend:p.profit)||0),out=$('dividendProjectInfo');if(out)out.innerHTML=`<b>${esc(p.name)}</b><br>กำไรคงเหลือที่ยังปันผลได้ <b class="positive">${money(available)}</b>`;const amount=document.querySelector('form [name="amount"]');if(amount)amount.max=available}

function openLookup(type,id){const list=type==='category'?S.data.categories:S.data.paymentMethods,item=list.find(x=>String(x.id)===String(id))||{},label=type==='category'?'หมวดค่าใช้จ่าย':'ช่องทางการจ่าย';modal(`${id?'แก้ไข':'เพิ่ม'}${label}`,`<form onsubmit="saveLookupForm(event,this,'${type}')"><input type="hidden" name="id" value="${esc(item.id||'')}"><div class="field"><label>ชื่อรายการ</label><input name="name" value="${esc(item.name||'')}" autocomplete="off" required></div><div class="field"><label>ลำดับแสดงผล</label><input name="sortOrder" type="number" min="1" step="1" value="${item.sortOrder||list.length+1}" required></div><button type="submit" class="btn full">${id?'บันทึกการแก้ไข':'เพิ่มรายการ'}</button></form>`)}
function openBalanceAccount(id){const list=S.data.balanceAccounts||[],item=list.find(x=>x.id===id)||{};modal(`${id?'แก้ไข':'เพิ่ม'}บัญชีเงินคงเหลือ`,`<form onsubmit="saveBalanceAccountForm(event,this)"><input type="hidden" name="id" value="${esc(item.id||'')}"><div class="field"><label>ชื่อบัญชี</label><input name="name" value="${esc(item.name||'')}" placeholder="เช่น กสิกร กระแสรายวัน" required></div><div class="form-grid"><div class="field"><label>ประเภท</label><select name="type"><option value="CASH" ${item.type==='CASH'?'selected':''}>เงินสด</option><option value="COMPANY" ${item.type==='COMPANY'?'selected':''}>บัญชีบริษัท</option></select></div><div class="field"><label>ยอดตั้งต้น</label><input name="openingBalance" type="number" step="0.01" value="${Number(item.openingBalance)||0}" required></div></div><div class="field"><label>ลำดับแสดงผล</label><input name="sortOrder" type="number" min="1" value="${item.sortOrder||list.length+1}" required></div><button type="submit" class="btn full">บันทึกบัญชี</button></form>`)}
